# Contrôles de cdx-windows, à chaque push et pull request.
name: build
on: [push, pull_request]
jobs:
  build:
    # windows-2025 (build 26100) : l'installeur exige Windows 11 (MinVersion 10.0.22000) ; sur windows-2022 (build 20348) Inno Setup refuse avec le code 1
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24 }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: 8.0.x }

      # La charte (web/cdx) vient du dépôt cdx-ui (node tools/charte-sync.mjs --write cdx-windows là-bas) : une copie retouchée à la main échoue ici.
      - name: Charter copies are untouched
        run: node tools/cdx-verify.mjs web/cdx/cdx-sync.json

      # Les pages de la suite suivent les règles de la charte (CHARTE.md §8) ; les copies de web/cdx sont contrôlées à la source.
      - name: Pages follow the charter
        run: node tools/charte-lint.mjs web --manifest web/cdx/cdx-sync.json

      # Chaque page porte une CSP qui n'autorise que ses propres scripts (aucun script en ligne, aucun attribut on…=) : voir tools/csp-check.mjs.
      - name: Pages have a strict CSP
        run: node tools/csp-check.mjs web

      - name: Build
        run: dotnet build Cdx.sln -c Release -o bin

      # Audio Linker (C++, src/cdx-audio_linker) : compilé et posé dans bin\ comme les autres programmes, pour l'installeur de la suite.
      # Ses propres contrôles (essais, page, installeur à lui, publication) sont dans audio_linker.yml.
      - name: Build Audio Linker
        shell: pwsh
        working-directory: src/cdx-audio_linker
        run: |
          cmake -B build -A x64   # générateur : le Visual Studio installé sur le serveur (2022 ou plus récent)
          if ($LASTEXITCODE -ne 0) { throw "Configuration d'Audio Linker échouée" }
          cmake --build build --config Release
          if ($LASTEXITCODE -ne 0) { throw "Compilation d'Audio Linker échouée" }
          Copy-Item build\Release\cdx-audio_linker.exe ..\..\bin\cdx-audio_linker.exe

      # Les auto-tests qui n'ouvrent pas de fenêtre visible ni ne touchent au son. Ce sont des programmes Windows (sans console) :
      # Start-Process -Wait est nécessaire pour attendre leur fin et lire leur code de sortie.
      - name: Self-tests (bus, Audio Linker link, snapping, files, git)
        shell: pwsh
        run: |
          foreach ($t in @(@('cdx-shell', '--selftest-bus'), @('cdx-shell', '--selftest-audio'), @('cdx-shell', '--selftest-snap'), @('cdx-shell', '--selftest-spell'), @('cdx-explorer', '--selftest-fs'), @('cdx-repos', '--selftest-git'))) {
            $p = Start-Process "bin\$($t[0]).exe" -ArgumentList $t[1] -Wait -PassThru
            "$($t[0]) $($t[1]) : code $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { Get-Content "$env:LOCALAPPDATA\CdxShell\selftest*.txt"; throw "$($t[1]) en échec" }
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --no-progress -y   # version fixée : un installeur se reconstruit à l'identique

      - name: Build installer
        shell: pwsh
        run: .\installer\build.ps1 -Bin bin

      # Ce qu'un utilisateur fait : installer en silence, vérifier les fichiers, réinstaller par-dessus, désinstaller. /NOSTOP=1 : rien à arrêter sur le runner.
      - name: Installer test (install, upgrade, uninstall)
        shell: pwsh
        run: |
          $version = ((Get-Content Directory.Build.props -Raw) | Select-String '<Version>(\d+\.\d+\.\d+)</Version>').Matches[0].Groups[1].Value
          $setup = (Get-ChildItem installer\Output\CDX-Setup-*.exe).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'CDXInstalled'
          $log = Join-Path $env:RUNNER_TEMP 'cdx-setup.log'
          $a = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/NOSTOP=1', "/DIR=`"$dir`"", "/LOG=`"$log`"")
          foreach ($pass in 1, 2) {
            $p = Start-Process $setup -ArgumentList $a -Wait -PassThru
            if ($p.ExitCode -ne 0) { if (Test-Path $log) { Get-Content $log | Select-Object -Last 40 }; throw "Installation (passage $pass) : code $($p.ExitCode)" }
            foreach ($exe in 'cdx-shell', 'cdx-explorer', 'cdx-browser', 'cdx-transfers', 'cdx-repos', 'cdx-notes', 'cdx-notes-mcp', 'cdx-terminal', 'cdx-agenda', 'cdx-mail', 'cdx-youtube', 'cdx-audio_linker') { if (-not (Test-Path "$dir\$exe.exe")) { throw "$exe.exe absent après installation" } }
            if (-not (Test-Path "$dir\web\cdx\cdx-ui.css")) { throw 'les pages (web\) manquent' }
            if (Test-Path "$dir\web\explorer\_test-explorer.html") { throw 'une page de test a été installée' }
          }
          $ver = (Get-Item "$dir\cdx-shell.exe").VersionInfo.FileVersion
          if ($ver -ne "$version.0") { throw "Version installée $ver inattendue (attendu $version.0)" }
          $p = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOSTOP=1', "/LOG=`"$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { if (Test-Path $log) { Get-Content $log | Select-Object -Last 40 }; throw "Désinstallation : code $($p.ExitCode)" }
          Start-Sleep -Seconds 2
          if (Test-Path "$dir\cdx-shell.exe") { throw 'cdx-shell.exe encore présent après désinstallation' }

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CDX-installer
          path: |
            installer/Output/CDX-Setup-*.exe
            installer/Output/CDX-Setup-*.exe.sha256
          if-no-files-found: error
