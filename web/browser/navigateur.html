<!doctype html>
<html lang="fr" data-theme="rouge">
<head>
<meta charset="utf-8">
<title>CDX — Navigateur</title>
<link rel="stylesheet" href="/cdx/fonts.css">
<link rel="stylesheet" href="/cdx/cdx-ui.css">
<link rel="stylesheet" href="/cdx/themes.css">
<link rel="stylesheet" href="/cdx/cdx-frame.css">
<link rel="stylesheet" href="/cdx/page.css">
<style>
  /* Le cadre du navigateur : tout ce qui entoure la page web. Les pages sont des WebView2 posés par le programme sur le rectangle #viewport. */
  .tabs { cursor: default; gap: 0; overflow: hidden; }
  .tab { flex: 0 1 190px; min-width: 56px; max-width: 190px; display: flex; align-items: center; gap: 6px; padding: 0 6px 0 8px; cursor: default; }
  .tab .tt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
  .tab .x { flex: none; width: 14px; text-align: center; color: var(--faint); }
  .tab .x:hover { color: #fff; background: var(--a-mid); }
  .tab img { width: 16px; height: 16px; flex: none; image-rendering: pixelated; }
  .tab.new { flex: none; min-width: 0; max-width: none; padding: 0 9px; }
  .tab .spin { flex: none; }
  .nav { display: flex; gap: 5px; flex: none; align-items: center; }
  .nav .btn { padding: 0 9px; display: flex; align-items: center; gap: 6px; }
  .nav .btn.on { background: #2a2a2a; box-shadow: var(--bevel-down); }
  .nav .btn:disabled { color: var(--faint); }
  #addr { height: 22px; }
  #findbar { display: flex; align-items: center; gap: 6px; flex: none; }
  #findbar[hidden] { display: none; }
  #viewport { flex: 1; min-height: 0; background: #000; border: 1px solid; border-color: var(--sunken-border); box-shadow: var(--sunken-shadow); }
  .badge { color: var(--warn); }
  .status .z { margin-left: auto; cursor: default; }
</style>
<script src="/cdx/icons.js"></script>
<script src="/cdx/cdx-bridge.js"></script>
<script src="/cdx/cdx-frame.js"></script>
<script src="/cdx/host.js"></script>
</head>
<body>
<div class="win active" id="win">
  <div class="tb" id="tb" data-dblclick="max"><button class="tb-btn tb-l" id="bx" data-act="close"><svg viewBox="0 0 9 9"><path d="M1 1L8 8M8 1L1 8" stroke="#fff" stroke-width="2" fill="none"/></svg></button><button class="tb-btn tb-m" data-act="menu" title="Réglages"></button><span class="tb-title" id="ttl">Navigateur</span><button class="tb-btn tb-r2" id="bmax" data-act="max"><svg viewBox="0 0 9 9"><path d="M1 4.5H8M4.5 1V8" stroke="#fff" stroke-width="2" fill="none"/></svg></button><button class="tb-btn tb-r" id="bmin" data-act="min"><svg viewBox="0 0 9 9"><path d="M1 4.5H8" stroke="#fff" stroke-width="2" fill="none"/></svg></button></div>
  <div class="tabs" id="tabs"></div>
  <div class="cb">
    <div class="nav">
      <button class="btn" id="back" title="Précédent (Alt+←, bouton latéral de la souris)">←</button>
      <button class="btn" id="fwd" title="Suivant (Alt+→, bouton latéral de la souris)">→</button>
      <button class="btn" id="reload" title="Actualiser (F5)"><span class="pix" data-ic="maj"></span></button>
      <input id="addr" class="text-input" type="text" spellcheck="false" autocomplete="off" placeholder="Rechercher ou saisir une adresse">
      <button class="btn" id="star" title="Ajouter aux favoris (Ctrl+D)"><span class="pix" data-ic="carnet"></span></button>
      <button class="btn" id="favs" title="Favoris"><span class="pix" data-ic="liste"></span></button>
      <button class="btn" id="hist" title="Historique (Ctrl+H)"><span class="pix" data-ic="horloge"></span></button>
      <button class="btn" id="dl" title="Téléchargements (Ctrl+J)"><span class="pix" data-ic="telecharger"></span><span class="badge" id="dlb"></span></button>
    </div>
    <div id="findbar" hidden>
      <input id="find" class="text-input" type="text" placeholder="Rechercher dans la page…" spellcheck="false" autocomplete="off" style="flex:none;width:300px">
      <button class="btn" id="fprev" title="Précédent (Maj+Entrée)">↑</button><button class="btn" id="fnext" title="Suivant (Entrée)">↓</button>
      <span class="faint" id="fcount"></span><span style="flex:1"></span><button class="btn" id="fclose" title="Fermer (Échap)">Fermer</button>
    </div>
    <div id="viewport"></div>
    <div class="status"><span class="orb" id="orb"></span><span id="st"></span><span class="z" id="zoom" title="Cliquer pour revenir à 100 %"></span></div>
  </div>
</div>
<i class="rz l" data-e="10"></i><i class="rz r" data-e="11"></i><i class="rz t" data-e="12"></i><i class="rz tl" data-e="13"></i><i class="rz tr" data-e="14"></i><i class="rz b" data-e="15"></i><i class="rz bl" data-e="16"></i><i class="rz br" data-e="17"></i>
<script>
  fillPix();
  const $ = id => document.getElementById(id);
  let st = { active: 0, items: [] }, hover = '';
  const cur = () => st.items.find(t => t.id === st.active);

  function renderTabs() {
    $('tabs').innerHTML = st.items.map(t => `<button class="tab ${t.id === st.active ? 'on' : ''}" data-id="${t.id}" title="${esc(t.title)}">${t.favicon ? `<img src="data:image/png;base64,${t.favicon}" alt="">` : `<span class="pix">${pix(t.internalPage ? 'kirc' : 'serveur', 16)}</span>`}<span class="tt">${esc(t.loading ? 'Chargement… ' + t.title : t.title)}</span><span class="x" data-x="${t.id}" title="Fermer (Ctrl+W)">×</span></button>`).join('')
      + '<button class="tab new" data-new title="Nouvel onglet (Ctrl+T)">+</button>';
  }
  function renderBar() {
    const t = cur(); if (!t) return;
    $('back').disabled = !t.canBack; $('fwd').disabled = !t.canFwd;
    $('reload').innerHTML = `<span class="pix">${pix(t.loading ? 'erreur' : 'maj', 16)}</span>`; $('reload').title = t.loading ? 'Arrêter' : 'Actualiser (F5)';
    if (document.activeElement !== $('addr')) $('addr').value = t.url;
    $('star').classList.toggle('on', !!t.starred); $('star').disabled = !t.url;
    $('ttl').textContent = t.title + ' — Navigateur';
    $('orb').className = 'orb ' + (t.loading ? 'amber pulse' : 'green');
    $('st').textContent = hover || (t.loading ? 'Chargement…' : 'Terminé');
    $('zoom').textContent = t.zoom !== 100 ? `Zoom ${t.zoom} %` : '';
  }
  handlers.tabs = m => { st = m; renderTabs(); renderBar(); };
  handlers.status = m => { hover = m.text; const t = cur(); if (t) $('st').textContent = hover || (t.loading ? 'Chargement…' : 'Terminé'); };
  handlers.downloads = m => { $('dlb').textContent = m.active ? ' ' + m.active : ''; };
  handlers.focusAddr = () => { $('addr').focus(); $('addr').select(); };
  handlers.nav = m => post({ cmd: m.dir === 'back' ? 'br.back' : 'br.fwd' });   // boutons latéraux de la souris (crochet du shell)

  $('tabs').onclick = e => {
    const x = e.target.closest('[data-x]'); if (x) { post({ cmd: 'br.close', id: +x.dataset.x }); return; }
    if (e.target.closest('[data-new]')) { post({ cmd: 'br.newtab' }); return; }
    const t = e.target.closest('[data-id]'); if (t) post({ cmd: 'br.select', id: +t.dataset.id });
  };
  $('tabs').onauxclick = e => { const t = e.target.closest('[data-id]'); if (e.button === 1 && t) post({ cmd: 'br.close', id: +t.dataset.id }); };
  $('back').onclick = () => post({ cmd: 'br.back' }); $('fwd').onclick = () => post({ cmd: 'br.fwd' });
  $('reload').onclick = () => post({ cmd: cur() && cur().loading ? 'br.stop' : 'br.reload' });
  $('star').onclick = () => post({ cmd: 'br.star' });
  $('favs').onclick = () => post({ cmd: 'br.internal', p: 'favoris' }); $('hist').onclick = () => post({ cmd: 'br.internal', p: 'historique' }); $('dl').onclick = () => post({ cmd: 'br.internal', p: 'telechargements' });
  // Les réglages de la fenêtre (bouton hachuré de la barre de titre) : les pages internes du navigateur et la fenêtre des transferts.
  windowSettings(() => [
    ['Favoris', () => post({ cmd: 'br.internal', p: 'favoris' })],
    ['Historique', () => post({ cmd: 'br.internal', p: 'historique' }), { key: 'Ctrl+H' }],
    ['Téléchargements', () => post({ cmd: 'br.internal', p: 'telechargements' }), { key: 'Ctrl+J' }],
    null,
    ['Fenêtre des transferts', () => post({ cmd: 'br.xfers' })],
  ]);
  $('zoom').onclick = () => post({ cmd: 'br.zoom', d: 0 });
  $('addr').onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') { post({ cmd: 'br.go', url: $('addr').value }); } else if (e.key === 'Escape') { const t = cur(); $('addr').value = t ? t.url : ''; $('addr').blur(); post({ cmd: 'br.focus' }); } };
  $('addr').onfocus = () => $('addr').select();
  $('addr').onblur = () => renderBar();

  // ---- recherche dans la page ----
  let lastTerm = '';
  const doFind = (dir, first) => post({ cmd: 'br.find', text: $('find').value, dir, first: first ? 1 : 0 });
  handlers.openFind = () => { $('findbar').hidden = false; $('find').focus(); $('find').select(); post({ cmd: 'br.findOpen' }); };
  handlers.closeFind = () => { $('findbar').hidden = true; $('fcount').textContent = ''; };
  handlers.find = m => { $('fcount').textContent = m.count ? `${m.index + 1} / ${m.count}` : ($('find').value ? 'Aucun résultat' : ''); };
  $('find').oninput = () => { lastTerm = $('find').value; doFind(1, true); };
  $('find').onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') doFind(e.shiftKey ? -1 : 1, false); else if (e.key === 'Escape') post({ cmd: 'br.findClose' }); };
  $('fnext').onclick = () => doFind(1, false); $('fprev').onclick = () => doFind(-1, false); $('fclose').onclick = () => post({ cmd: 'br.findClose' });

  // ---- raccourcis (quand c'est le cadre qui a le focus ; la page web les envoie par le programme) ----
  document.addEventListener('keydown', e => {
    const inField = e.target.matches('input');
    if (e.key === 'Escape' && !$('findbar').hidden) { post({ cmd: 'br.findClose' }); return; }
    if (inField && e.ctrlKey && [65, 67, 86, 88, 90, 89].includes(e.keyCode)) return;   // couper, copier, coller restent à la zone de saisie
    if ((e.ctrlKey || e.altKey || (e.keyCode >= 112 && e.keyCode <= 123)) && e.keyCode !== 17 && e.keyCode !== 18 && e.keyCode !== 16) { e.preventDefault(); post({ cmd: 'br.shortcut', vk: e.keyCode }); }
  });

  // ---- cadre de la fenêtre ----
  CdxFrame.init();   // barre de titre, boutons et bords : cdx-frame.js (la barre se double-clique pour agrandir)

  // ---- le rectangle des pages : le programme y pose les WebView2 des onglets ----
  const layout = () => { const r = $('viewport').getBoundingClientRect(); post({ cmd: 'br.layout', x: Math.round(r.left) + 1, y: Math.round(r.top) + 1, w: Math.round(r.width) - 2, h: Math.round(r.height) - 2 }); };
  new ResizeObserver(layout).observe($('viewport')); addEventListener('resize', layout); addEventListener('load', layout);

  if (!hasHost) handlers.tabs({ active: 2, items: [{ id: 1, title: 'Nouvel onglet', url: '', favicon: '', canBack: false, canFwd: false, zoom: 100, internalPage: true }, { id: 2, title: 'Documentation WebView2', url: 'https://learn.microsoft.com/fr-fr/microsoft-edge/webview2/', favicon: '', loading: false, canBack: true, canFwd: false, zoom: 125, starred: true }, { id: 3, title: 'Chargement…', url: 'https://exemple.fr', loading: true, canBack: false, canFwd: false, zoom: 100 }] });
  post({ cmd: 'br.ready' });
</script>
</body>
</html>
