<!doctype html>
<html lang="fr" data-theme="rouge">
<head>
<meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; img-src 'self' data: blob: https: http:; media-src 'self'; frame-src 'self'">
<title>CDX — Courrier</title>
<link rel="stylesheet" href="/cdx/fonts.css">
<link rel="stylesheet" href="/cdx/cdx-ui.css">
<link rel="stylesheet" href="/cdx/themes.css">
<link rel="stylesheet" href="/cdx/cdx-frame.css">
<link rel="stylesheet" href="/host/page.css">
<style>
  /* « Courrier » : la boîte Gmail du compte relié. Libellés à gauche, fils au milieu, le fil ouvert à droite ; les corps HTML sont dans un cadre isolé (sans script, images distantes bloquées). */
  .top { display: flex; gap: 5px; align-items: center; flex: none; }
  .top .text-input { flex: 1; max-width: 480px; }
  .split { flex: 1; min-height: 0; display: flex; gap: 5px; }
  .col { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 5px; }
  #labels { flex: none; width: 200px; }
  #list { flex: none; width: 380px; }
  #view { flex: 1; }
  .lbl { display: flex; align-items: center; gap: 6px; padding: 5px 8px 3px; cursor: default; border-left: 6px solid transparent; }
  .lbl:hover { background: var(--row-hover); }
  .lbl.on { background: var(--row-sel); box-shadow: inset 0 0 0 1px var(--row-sel-ring); color: #fff; }
  .lbl .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lbl .u { color: var(--warn); }
  .lbl.sep { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 6px; }
  .th { display: grid; grid-template-columns: 18px 1fr auto; gap: 2px 8px; padding: 6px 8px 4px 4px; border-bottom: 1px solid var(--line); border-left: 6px solid transparent; cursor: default; }
  .th:hover { background: var(--row-hover); }
  .th.on { background: var(--row-sel); box-shadow: inset 0 0 0 1px var(--row-sel-ring); }
  .th.unread { border-left-color: var(--accent); }
  .th.unread .f, .th.unread .s { color: #fff; }
  .th .st { grid-row: span 2; color: var(--faint); cursor: pointer; text-align: center; }
  .th .st.on { color: var(--warn); }
  .th .f, .th .s, .th .sn { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .th .f { color: var(--text); }
  .th .d { color: var(--faint); white-space: nowrap; }
  .th .s { color: var(--text); grid-column: 2 / 4; }
  .th .sn { color: var(--faint); grid-column: 2 / 4; }
  .th .c { color: var(--faint); }
  .vh { flex: none; display: flex; flex-direction: column; gap: 5px; }
  .vh .subj { color: #fff; letter-spacing: 1px; padding: 2px 2px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acts { display: flex; gap: 5px; flex-wrap: wrap; }
  .msgs { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
  .msg { background: var(--card-2); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; }
  .msg .hd { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
  .msg .hd .fr { color: #fff; }
  .msg .hd .to, .msg .hd .cc { color: var(--faint); grid-column: 1 / 3; }
  .msg .hd .dt { color: var(--faint); white-space: nowrap; }
  .msg .att { display: flex; gap: 5px; flex-wrap: wrap; }
  .msg .att .btn { padding: 0 9px; }
  .msg iframe { border: 1px solid var(--line); background: #fff; width: 100%; height: 120px; display: block; }
  .msg .imgs { color: var(--faint); display: flex; gap: 8px; align-items: center; }
  .hello { flex: 1; display: grid; place-items: center; text-align: center; color: var(--text); }
  .hello .box { display: flex; flex-direction: column; gap: 12px; align-items: center; max-width: 520px; }
  .hello .faint { line-height: 1.5; }
  .hello code { font-family: var(--font-log); color: var(--field-ink); user-select: text; }
  .err { color: var(--warn); }
  .veil { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; background: rgba(0, 0, 0, .5); }
  .veil .win { position: relative; inset: auto; width: 720px; }
  .veil .cb { gap: 6px; }
  .f { display: grid; grid-template-columns: 90px 1fr; gap: 6px 10px; align-items: center; }
  .f label { color: var(--faint); }
  .f textarea { height: 260px; resize: none; font-family: var(--font-log); line-height: 16px; }
  .chips { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 1px 6px 0 8px; background: var(--card-2); border: 1px solid var(--line); color: var(--text); }
  .chip i { color: var(--faint); cursor: pointer; font-style: normal; }
</style>
<script src="/cdx/icons.js"></script>
<script src="/cdx/cdx-bridge.js"></script>
<script src="/cdx/cdx-frame.js"></script>
<script src="/cdx/cdx-split.js"></script>
<script src="/cdx/cdx-spell.js"></script>
<script src="/host/host.js"></script>
</head>
<body>
<div class="win active" id="win">
  <div class="tb" id="tb" data-dblclick="max"><button class="tb-btn tb-l" id="bx" data-act="close"><svg viewBox="0 0 9 9"><path d="M1 1L8 8M8 1L1 8" stroke="#fff" stroke-width="2" fill="none"/></svg></button><button class="tb-btn tb-m" data-act="menu" title="Réglages"></button><span class="tb-title" id="ttl">Courrier</span><button class="tb-btn tb-r2" id="bmax" data-act="max"><svg viewBox="0 0 9 9"><path d="M1 4.5H8M4.5 1V8" stroke="#fff" stroke-width="2" fill="none"/></svg></button><button class="tb-btn tb-r" id="bmin" data-act="min"><svg viewBox="0 0 9 9"><path d="M1 4.5H8" stroke="#fff" stroke-width="2" fill="none"/></svg></button></div>
  <div class="cb">
    <div class="top">
      <button class="btn" id="new" title="Nouveau message (Ctrl+N)"><span class="pix" data-ic="editer"></span> Nouveau message</button>
      <input id="q" class="text-input" type="text" placeholder="Rechercher (syntaxe Gmail : from:, subject:, has:attachment…) — Entrée" spellcheck="false" autocomplete="off">
      <button class="btn" id="refresh" title="Relever (F5)"><span class="pix" data-ic="maj"></span></button>
    </div>
    <div class="split" id="split">
      <div class="col" id="labels"><div class="list" id="lbls"></div></div>
      <div class="col" id="list"><div class="list" id="ths" tabindex="0"></div></div>
      <div class="col" id="view"></div>
    </div>
    <div class="status"><span class="orb" id="orb"></span><span id="st1"></span><span class="faint" id="st2"></span><span style="margin-left:auto" class="faint" id="st3"></span></div>
  </div>
</div>
<i class="rz l" data-e="10"></i><i class="rz r" data-e="11"></i><i class="rz t" data-e="12"></i><i class="rz tl" data-e="13"></i><i class="rz tr" data-e="14"></i><i class="rz b" data-e="15"></i><i class="rz bl" data-e="16"></i><i class="rz br" data-e="17"></i>
<script src="/mail/courrier.js"></script>
</body>
</html>
