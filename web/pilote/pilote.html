<!doctype html>
<html lang="fr" data-theme="rouge">
<head>
<meta charset="utf-8">
<title>CDX — Pilote</title>
<link rel="stylesheet" href="/cdx/fonts.css">
<link rel="stylesheet" href="/cdx/cdx-ui.css">
<link rel="stylesheet" href="/cdx/themes.css">
<link rel="stylesheet" href="/cdx/cdx-frame.css">
<link rel="stylesheet" href="/cdx/page.css">
<style>
  /* « Pilote » : le chat avec Claude pour organiser et créer les projets. Trois colonnes : les conversations, le fil, les actions (accords à donner, journal). Le programme
     tient Claude Code et décide ; la page dessine et pose les questions. */
  .top { display: flex; gap: 5px; align-items: center; flex: none; }
  .top .ttl { color: var(--text); letter-spacing: 2px; }
  .split { flex: 1; min-height: 0; display: flex; gap: 5px; }
  .col { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 5px; }
  .convs { flex: none; width: 230px; }
  .chat { flex: 1; }
  .acts { flex: none; width: 320px; }
  /* dans une colonne flex, chaque entrée garde sa taille : c'est la colonne qui défile, le texte ne s'écrase pas */
  .msgs > *, .list > *, .jr > *, .asks > * { flex: none; }
  .list { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; background: var(--ink); border: 1px solid; border-color: var(--sunken-border); box-shadow: var(--sunken-shadow); }
  .cv { display: flex; flex-direction: column; gap: 2px; padding: 5px 8px 3px; border-bottom: 1px solid var(--line); cursor: default; }
  .cv:hover { background: var(--row-hover); }
  .cv.on { background: var(--row-sel); box-shadow: inset 0 0 0 1px var(--row-sel-ring); }
  .cv .t { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cv .d { color: var(--faint); display: flex; justify-content: space-between; }
  .cv.busy .t::before { content: "● "; color: var(--warn); }
  /* le fil */
  .msgs { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 10px; padding: 10px 12px; background: var(--ink); border: 1px solid; border-color: var(--sunken-border); box-shadow: var(--sunken-shadow); user-select: text; }
  .m { max-width: 92%; }
  .m.u { align-self: flex-end; padding: 6px 10px 4px; background: var(--card-2); border-left: 4px solid var(--a-edge); color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; }
  .m.a { align-self: stretch; max-width: none; color: var(--text); line-height: 1.45; overflow-wrap: anywhere; }
  .m.a p { margin: 0 0 8px; }
  .m.a ul, .m.a ol { margin: 0 0 8px; padding-left: 22px; }
  .m.a li { margin: 2px 0; }
  .m.a h1, .m.a h2, .m.a h3, .m.a h4 { margin: 8px 0 6px; font-weight: inherit; color: var(--text); letter-spacing: 1px; }
  .m.a code { font-family: var(--font-log); background: var(--card-2); padding: 0 4px; border: 1px solid var(--line); }
  .m.a pre { margin: 0 0 8px; padding: 8px 10px; overflow-x: auto; background: var(--card-2); border: 1px solid var(--line); }
  .m.a pre code { background: none; border: 0; padding: 0; }
  .m.a blockquote { margin: 0 0 8px; padding: 2px 12px; border-left: 4px solid var(--a-edge); color: var(--muted); }
  .m.a table { border-collapse: collapse; margin: 0 0 8px; }
  .m.a th, .m.a td { border: 1px solid var(--line); padding: 2px 8px; text-align: left; }
  .m.a a { color: var(--a-edge); }
  .m.a .tg { color: var(--faint); }
  .m.a img { max-width: 100%; }
  .m.n { align-self: center; color: var(--faint); }
  .m.a.live::after { content: "▌"; color: var(--warn); animation: pulse 1s ease-in-out infinite; }
  .tl { align-self: stretch; display: flex; align-items: center; gap: 7px; padding: 2px 6px 0; color: var(--faint); white-space: nowrap; overflow: hidden; }
  .tl .nm { color: var(--text); flex: none; }
  .tl .tg { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .tl .st { flex: none; }
  .tl.ok .st { color: var(--green); }
  .tl.err .st { color: var(--red); }
  .tl.ask { color: var(--warn); }
  .tl.ask.done { color: var(--faint); }
  /* la saisie */
  .compose { flex: none; display: flex; gap: 5px; align-items: flex-end; }
  .compose textarea { flex: 1; min-height: 46px; max-height: 160px; line-height: 15px; padding: 6px 8px; font-family: var(--font); resize: none; }
  .compose .btns { margin: 0; flex-direction: column; align-items: stretch; }
  /* les actions */
  .acts .hd { color: var(--text); letter-spacing: 1px; padding: 2px 2px 0; display: flex; justify-content: space-between; flex: none; }
  .asks { flex: none; display: flex; flex-direction: column; gap: 6px; max-height: 55%; overflow: auto; }
  .ask { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; background: var(--card-2); border: 1px solid var(--warn); }
  .ask .t { color: var(--text); letter-spacing: 1px; }
  .ask .d { color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--font-log); max-height: 180px; overflow: auto; user-select: text; }
  .ask .q { color: var(--text); margin-top: 4px; }
  .ask label { display: flex; gap: 6px; align-items: flex-start; color: var(--text); cursor: default; }
  .ask label input { margin: 2px 0 0; flex: none; accent-color: var(--a-edge); }
  .ask label .faint { display: block; }
  .ask .btns { justify-content: flex-start; }
  .jr { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; background: var(--ink); border: 1px solid; border-color: var(--sunken-border); box-shadow: var(--sunken-shadow); }
  .jr .tl { padding: 3px 6px 1px; border-bottom: 1px solid var(--line); }
  /* non prêt */
  .hello { flex: 1; display: grid; place-items: center; text-align: center; color: var(--text); }
  .hello .box { display: flex; flex-direction: column; gap: 12px; align-items: center; max-width: 560px; }
  .hello .faint { line-height: 1.5; }
  .hello code { font-family: var(--font-log); color: var(--field-ink); user-select: text; }
  .err { color: var(--warn); }
  .quota { color: var(--faint); }
  .quota.hi { color: var(--warn); }
</style>
<script src="/cdx/icons.js"></script>
<script src="/cdx/cdx-bridge.js"></script>
<script src="/cdx/cdx-frame.js"></script>
<script src="/cdx/cdx-split.js"></script>
<script src="/cdx/cdx-spell.js"></script>
<script src="/cdx/host.js"></script>
<script src="/notes/js/md.js"></script>
</head>
<body>
<div class="win active" id="win">
  <div class="tb" id="tb" data-dblclick="max"><button class="tb-btn tb-l" id="bx" data-act="close"><svg viewBox="0 0 9 9"><path d="M1 1L8 8M8 1L1 8" stroke="#fff" stroke-width="2" fill="none"/></svg></button><button class="tb-btn tb-m" data-act="menu" title="Réglages"></button><span class="tb-title" id="ttl">Pilote</span><button class="tb-btn tb-r2" id="bmax" data-act="max"><svg viewBox="0 0 9 9"><path d="M1 4.5H8M4.5 1V8" stroke="#fff" stroke-width="2" fill="none"/></svg></button><button class="tb-btn tb-r" id="bmin" data-act="min"><svg viewBox="0 0 9 9"><path d="M1 4.5H8" stroke="#fff" stroke-width="2" fill="none"/></svg></button></div>
  <div class="cb">
    <div class="top">
      <span class="ttl">PILOTE</span>
      <span class="faint" id="sub">Claude, pour organiser et créer tes projets</span>
      <span class="grow"></span>
      <button class="btn" id="new" title="Nouvelle conversation (Ctrl+N)"><span class="pix" data-ic="editer"></span> Nouvelle conversation</button>
    </div>
    <div class="split" id="split">
      <div class="col convs" id="convs"><div class="list" id="cvlist"></div></div>
      <div class="col chat" id="chat">
        <div class="msgs" id="msgs"></div>
        <div class="compose">
          <textarea class="text-input" id="in" rows="2" placeholder="Dis ce que tu veux organiser ou créer… (Entrée : envoyer, Maj+Entrée : à la ligne)" spellcheck="true"></textarea>
          <div class="btns"><button class="primary" id="send">Envoyer</button><button class="btn" id="stop" disabled>Arrêter</button></div>
        </div>
      </div>
      <div class="col acts" id="acts">
        <div class="hd"><span>ACTIONS</span><span class="faint" id="lvl"></span></div>
        <div class="asks" id="asks"></div>
        <div class="jr" id="jr"></div>
      </div>
    </div>
    <div class="status"><span class="orb" id="orb"></span><span id="st1"></span><span class="faint" id="st2"></span><span style="margin-left:auto" class="quota" id="st3"></span></div>
  </div>
</div>
<i class="rz l" data-e="10"></i><i class="rz r" data-e="11"></i><i class="rz t" data-e="12"></i><i class="rz tl" data-e="13"></i><i class="rz tr" data-e="14"></i><i class="rz b" data-e="15"></i><i class="rz bl" data-e="16"></i><i class="rz br" data-e="17"></i>
<script>
  fillPix();
  const $ = id => document.getElementById(id);
  let state = { conversations: [], current: null, busy: false, level: 'libre', model: '', effort: '', claude: true, claudeExe: '', error: '', pending: [], quota: null };
  let items = [], partial = '', conv = null, thinking = false;
  const LEVELS = [['libre', 'Lecture libre, irréversible confirmé'], ['prudent', 'Confirmer chaque écriture'], ['auto', 'Tout automatique (sauf irréversible)']];
  const MODELS = [['', 'Par défaut'], ['fable', 'Fable'], ['opus', 'Opus'], ['sonnet', 'Sonnet'], ['haiku', 'Haiku']];
  const EFFORTS = [['', 'Par défaut'], ['low', 'Bas'], ['medium', 'Moyen'], ['high', 'Élevé'], ['xhigh', 'Très élevé'], ['max', 'Maximum']];
  const md = t => Md.render(t, { resolve: () => null, imageUrl: () => null }).html;
  const when = s => { if (!s) return ''; const d = new Date(s); const t = new Date(); return isNaN(d) ? '' : (d.toDateString() === t.toDateString() ? `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}` : `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}`); };

  // ---- conversations ----
  function renderConvs() {
    $('cvlist').innerHTML = state.conversations.map(c => `<div class="cv ${c.id === state.current ? 'on' : ''} ${c.busy ? 'busy' : ''}" data-id="${esc(c.id)}" title="${esc(c.title || 'Sans titre')}"><span class="t">${esc(c.title || 'Nouvelle conversation')}</span><span class="d"><span>${c.turns || 0} message${(c.turns || 0) > 1 ? 's' : ''}</span><span>${when(c.updated)}</span></span></div>`).join('') || '<div class="empty">Aucune conversation. Clique « Nouvelle conversation ».</div>';
  }
  $('cvlist').addEventListener('click', e => { const c = e.target.closest('[data-id]'); if (c && c.dataset.id !== state.current) post({ cmd: 'pl.open', id: c.dataset.id }); });
  $('cvlist').addEventListener('contextmenu', e => {
    const c = e.target.closest('[data-id]'); if (!c) return; e.preventDefault();
    const cv = state.conversations.find(x => x.id === c.dataset.id); if (!cv) return;
    CdxFrame.menu([
      ['Renommer…', () => { const v = prompt('Titre de la conversation', cv.title); if (v !== null && v.trim()) post({ cmd: 'pl.rename', id: cv.id, title: v.trim() }); }],
      null,
      ['Supprimer', () => { if (confirm('Supprimer « ' + (cv.title || 'cette conversation') + ' » ? Le fil affiché ici est effacé (la session Claude Code reste dans ses propres archives).')) post({ cmd: 'pl.delete', id: cv.id }); }],
    ], e.clientX, e.clientY, cv.title || 'Conversation');
  });

  // ---- le fil ----
  const toolLine = it => `<div class="tl ${it.ok === true ? 'ok' : it.ok === false ? 'err' : ''}" data-tool="${esc(it.id || '')}" title="${esc(it.result || it.target || '')}"><span class="pix">${pix('apps', 16)}</span><span class="nm">${esc(it.name)}</span><span class="tg">${esc(it.target || '')}</span><span class="st">${it.ok === true ? 'ok' : it.ok === false ? 'erreur' : '…'}</span></div>`;
  const askLine = it => `<div class="tl ask ${it.decision === 'attente' ? '' : 'done'}" data-ask="${esc(it.id || '')}" title="${esc(it.detail || '')}"><span class="pix">${pix(it.decision === 'refusé' ? 'erreur' : it.decision === 'attente' ? 'cloche' : 'cadenas', 16)}</span><span class="nm">${esc(it.title)}</span><span class="tg">${esc((it.detail || '').split('\n')[0])}</span><span class="st">${esc(it.decision === 'auto' ? 'auto' : it.decision)}</span></div>`;
  function itemHtml(it) {
    if (it.kind === 'user') return `<div class="m u">${esc(it.text)}</div>`;
    if (it.kind === 'assistant') return `<div class="m a">${md(it.text)}</div>`;
    if (it.kind === 'tool') return toolLine(it);
    if (it.kind === 'ask') return askLine(it);
    return `<div class="m n">${esc(it.text || '')}</div>`;
  }
  function renderMsgs() {
    const box = $('msgs');
    if (!state.claude) {
      box.innerHTML = `<div class="hello"><div class="box"><div style="letter-spacing:3px">PILOTE</div><div class="faint">Il faut Claude Code sur ce PC : Pilote le lance en sous-processus (ton abonnement Claude). Installe-le, ou indique le chemin de <code>claude.exe</code> dans la variable d’environnement <code>CDX_CLAUDE_EXE</code>, puis relance Pilote.</div>${state.error ? `<div class="err">${esc(state.error)}</div>` : ''}</div></div>`; return;
    }
    if (!state.current) { box.innerHTML = `<div class="hello"><div class="box"><div style="letter-spacing:3px">PILOTE</div><div class="faint">Claude, réservé à l’organisation et à la création de tes projets : fiches dans Notes, dossiers et dépôts, tâches et échéances, recherches sur le web dans le navigateur CDX. Il peut ouvrir et commander les programmes de la suite ; ce qui est irréversible attend ton accord dans le volet de droite.</div><button class="primary" id="go">Nouvelle conversation</button></div></div>`; const g = $('go'); if (g) g.onclick = () => post({ cmd: 'pl.new' }); return; }
    box.innerHTML = items.map(itemHtml).join('') + (partial ? `<div class="m a live" id="live">${md(partial)}</div>` : (state.busy ? `<div class="m n" id="wait">${thinking ? 'Claude réfléchit…' : 'Claude travaille…'}</div>` : '')) + (items.length === 0 && !state.busy ? '<div class="empty">Écris ce que tu veux organiser ou créer.</div>' : '');
    box.scrollTop = box.scrollHeight;
  }
  function appendItem(it) {
    items.push(it); const box = $('msgs'); const live = $('live'), wait = $('wait'); if (live) live.remove(); if (wait) wait.remove();
    const e = box.querySelector('.empty'); if (e) e.remove();
    box.insertAdjacentHTML('beforeend', itemHtml(it));
    if (state.busy && it.kind !== 'assistant') box.insertAdjacentHTML('beforeend', `<div class="m n" id="wait">Claude travaille…</div>`);
    box.scrollTop = box.scrollHeight;
  }
  function renderPartial() {
    const box = $('msgs'); let live = $('live'); const wait = $('wait'); if (wait) wait.remove();
    if (!live) { box.insertAdjacentHTML('beforeend', '<div class="m a live" id="live"></div>'); live = $('live'); }
    live.innerHTML = md(partial); box.scrollTop = box.scrollHeight;
  }

  // ---- les actions ----
  function renderAsks() {
    const list = state.pending || [];
    $('asks').innerHTML = list.map(p => {
      if (p.tool === 'AskUserQuestion' && p.input && p.input.questions) {
        const qs = p.input.questions;
        return `<div class="ask" data-ask="${esc(p.id)}"><span class="t">Claude te demande</span>${qs.map((q, i) => `<div class="q">${esc(q.question)}</div>${(q.options || []).map((o, j) => `<label><input type="${q.multiSelect ? 'checkbox' : 'radio'}" name="q${i}" value="${esc(o.label)}" data-q="${i}"><span>${esc(o.label)}<span class="faint">${esc(o.description || '')}</span></span></label>`).join('')}<label><input type="${q.multiSelect ? 'checkbox' : 'radio'}" name="q${i}" value="" data-q="${i}" data-other><span>Autre : <input class="text-input" data-other-text="${i}" placeholder="ta réponse" spellcheck="false"></span></label>`).join('')}<div class="btns"><button class="primary" data-reply="${esc(p.id)}">Répondre</button><button class="btn" data-deny="${esc(p.id)}">Ignorer</button></div></div>`;
      }
      return `<div class="ask" data-ask="${esc(p.id)}"><span class="t">${esc(p.title)}</span><div class="d">${esc(p.detail || '')}</div><div class="btns"><button class="primary" data-allow="${esc(p.id)}">Autoriser</button><button class="btn" data-deny="${esc(p.id)}">Refuser</button><button class="btn" data-denymsg="${esc(p.id)}" title="Refuser en disant pourquoi">Refuser…</button></div></div>`;
    }).join('');
    $('lvl').textContent = (LEVELS.find(l => l[0] === state.level) || LEVELS[0])[1];
  }
  $('asks').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.allow) post({ cmd: 'pl.answer', id: b.dataset.allow, allow: true });
    else if (b.dataset.deny) post({ cmd: 'pl.answer', id: b.dataset.deny, allow: false, message: 'Valentin a refusé.' });
    else if (b.dataset.denymsg) { const m = prompt('Pourquoi, ou que faire à la place ?'); if (m !== null) post({ cmd: 'pl.answer', id: b.dataset.denymsg, allow: false, message: m.trim() || 'Valentin a refusé.' }); }
    else if (b.dataset.reply) {
      const p = (state.pending || []).find(x => x.id === b.dataset.reply); if (!p) return;
      const card = b.closest('.ask'); const answers = {};
      p.input.questions.forEach((q, i) => {
        const picked = [...card.querySelectorAll(`input[data-q="${i}"]:checked`)].map(x => x.hasAttribute('data-other') ? (card.querySelector(`[data-other-text="${i}"]`).value.trim()) : x.value).filter(Boolean);
        answers[q.question] = q.multiSelect ? picked.join(', ') : (picked[0] || '');
      });
      post({ cmd: 'pl.answer', id: p.id, allow: true, updatedInput: { questions: p.input.questions, answers } });
    }
  });
  function renderJournal() {
    const acts = items.filter(it => it.kind === 'tool' || it.kind === 'ask').slice(-80).reverse();
    $('jr').innerHTML = acts.map(it => it.kind === 'tool' ? toolLine(it) : askLine(it)).join('') || '<div class="empty">Ce que Claude fait sur la suite s’affiche ici.</div>';
  }

  // ---- état ----
  function setStatus() {
    const busy = state.busy;
    $('orb').className = 'orb ' + (busy ? 'amber pulse' : state.error ? 'red' : state.claude ? 'green' : '');
    $('st1').textContent = state.error ? state.error : busy ? ((state.pending || []).length ? 'Claude attend ton accord' : (thinking ? 'Claude réfléchit…' : 'Claude travaille…')) : state.claude ? 'Prêt' : 'Claude Code introuvable';
    $('st2').textContent = [state.model ? 'modèle ' + state.model : '', state.effort ? 'effort ' + state.effort : ''].filter(Boolean).join(' · ');
    $('send').disabled = busy || !state.claude; $('stop').disabled = !busy;
    if (state.quota) { const p = Math.round(state.quota.part * 100); const r = state.quota.reset ? new Date(state.quota.reset * 1000) : null; $('st3').textContent = `abonnement : ${p} % des 5 h${r ? ' · remise à zéro ' + when(r.toISOString()) : ''}${state.quota.seven >= 0 ? ' · ' + Math.round(state.quota.seven * 100) + ' % des 7 jours' : ''}`; $('st3').className = 'quota ' + (p >= 80 ? 'hi' : ''); } else $('st3').textContent = '';
  }
  handlers.state = m => {
    const was = state.current; state = m; if (m.current !== was) { items = []; partial = ''; }
    renderConvs(); renderAsks(); setStatus(); if (m.current !== was || !m.busy) renderMsgs(); renderJournal();
  };
  handlers.items = m => { if (m.conv !== state.current) return; items = m.items || []; partial = m.partial || ''; thinking = false; renderMsgs(); renderJournal(); };
  handlers.item = m => { if (m.conv !== state.current) return; if (m.item.kind === 'assistant') { partial = ''; const live = $('live'); if (live) live.remove(); } appendItem(m.item); if (m.item.kind !== 'user') renderJournal(); };
  handlers.delta = m => { if (m.conv !== state.current) return; thinking = false; partial += m.text; renderPartial(); };
  handlers.thinking = m => { if (m.conv !== state.current) return; thinking = true; const w = $('wait'); if (w) w.textContent = 'Claude réfléchit…'; setStatus(); };
  handlers.status = m => { if (m.conv === state.current && !partial) { const w = $('wait'); if (w) w.textContent = m.text === 'requesting' ? 'Claude réfléchit…' : 'Claude travaille…'; } };
  handlers.toolresult = m => { if (m.conv !== state.current) return; const it = items.find(x => x.kind === 'tool' && x.id === m.id); if (it) { it.ok = m.ok; it.result = m.result; } document.querySelectorAll(`[data-tool="${CSS.escape(m.id)}"]`).forEach(el => { el.classList.toggle('ok', m.ok === true); el.classList.toggle('err', m.ok === false); el.title = m.result || ''; el.querySelector('.st').textContent = m.ok ? 'ok' : 'erreur'; }); };
  handlers.ask = m => { if (m.conv !== state.current) return; appendItem({ kind: 'ask', id: m.id, title: m.title, detail: m.detail, decision: 'attente' }); renderJournal(); };
  handlers.askdone = m => { if (m.conv !== state.current) return; const it = items.find(x => x.kind === 'ask' && x.id === m.id); if (it) it.decision = m.decision || 'refusé'; document.querySelectorAll(`[data-ask="${CSS.escape(m.id)}"] .st`).forEach(el => el.textContent = m.decision || ''); document.querySelectorAll(`.tl[data-ask="${CSS.escape(m.id)}"]`).forEach(el => el.classList.add('done')); };
  handlers.result = m => { if (m.conv !== state.current) return; partial = ''; thinking = false; const live = $('live'), wait = $('wait'); if (live) live.remove(); if (wait) wait.remove(); if (m.ctxMax) $('st2').textContent = `contexte ${Math.round(m.ctxUsed / 1000)} k / ${Math.round(m.ctxMax / 1000)} k` + (m.ms ? ` · ${Math.round(m.ms / 1000)} s` : ''); $('in').focus(); };
  handlers.quota = m => { state.quota = m; setStatus(); };
  handlers.init = m => { if (m.conv === state.current) $('st2').textContent = 'modèle ' + m.model + (m.mcp ? ' · MCP ' + m.mcp : ''); };
  handlers.error = m => { state.error = m.text; setStatus(); setTimeout(() => { state.error = ''; setStatus(); }, 6000); };

  // ---- saisie ----
  const fit = () => { const t = $('in'); t.style.height = 'auto'; t.style.height = Math.min(160, Math.max(46, t.scrollHeight + 2)) + 'px'; };
  function send() { const t = $('in').value.trim(); if (!t || state.busy) return; post({ cmd: 'pl.send', id: state.current, text: t }); $('in').value = ''; fit(); }
  $('send').onclick = send;
  $('stop').onclick = () => post({ cmd: 'pl.stop' });
  $('new').onclick = () => post({ cmd: 'pl.new' });
  $('in').addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
  $('in').addEventListener('input', fit);
  $('msgs').addEventListener('click', e => { const a = e.target.closest('a[href]'); if (a) { e.preventDefault(); if (/^https?:/.test(a.href)) post({ cmd: 'pl.open-url', url: a.href }); } });
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'n') { e.preventDefault(); post({ cmd: 'pl.new' }); }
    else if (e.key === 'Escape' && state.busy) post({ cmd: 'pl.stop' });
  });

  // ---- réglages de la fenêtre ----
  // le correcteur orthographique (cdx-spell.js) sur la zone de saisie ; réglage gardé
  const spellKey = 'cdx.pilote.spell', gramKey = 'cdx.pilote.grammaire'; let spell = true, gram = true; try { spell = localStorage.getItem(spellKey) !== 'off'; gram = localStorage.getItem(gramKey) !== 'off'; } catch (e) { }
  const spellIn = window.CdxSpell ? CdxSpell.attach($('in'), { enabled: spell, grammar: '/cdx/grammaire-worker.js', grammarEnabled: gram }) : null;
  const setSpell = on => { spell = on; try { localStorage.setItem(spellKey, on ? 'on' : 'off'); } catch (e) { } if (spellIn) spellIn.enable(on); };
  const setGram = on => { gram = on; try { localStorage.setItem(gramKey, on ? 'on' : 'off'); } catch (e) { } if (spellIn) spellIn.grammar(on); };
  windowSettings(() => [
    ['Autonomie', null, { sub: LEVELS.map(([k, n]) => [n, () => post({ cmd: 'pl.level', value: k }), { check: state.level === k }]) }],
    ['Modèle', null, { sub: MODELS.map(([k, n]) => [n, () => post({ cmd: 'pl.model', value: k }), { check: (state.model || '') === k }]) }],
    ['Effort', null, { sub: EFFORTS.map(([k, n]) => [n, () => post({ cmd: 'pl.effort', value: k }), { check: (state.effort || '') === k }]) }],
    null,
    ['Correcteur orthographique', () => setSpell(!spell), { check: spell }],
    ['Grammaire (accords, conjugaison)', () => setGram(!gram), { check: gram }],
    null,
    ['Ouvrir le dossier des projets', () => post({ cmd: 'pl.open-path', path: state.root })],
    ['Mémoire de Pilote (dans Notes)', () => post({ cmd: 'pl.memory' })],
  ]);

  CdxFrame.init();
  CdxSplit.init({ pane: $('convs'), side: 'left', key: 'pilote-conversations', min: 160, max: 420 });
  CdxSplit.init({ pane: $('acts'), side: 'right', key: 'pilote-actions', min: 240, max: 640 });
  renderConvs(); renderMsgs(); renderAsks(); setStatus();
  if (!hasHost) {
    handlers.state({ conversations: [{ id: 'a', title: 'Projet Zeta', updated: new Date().toISOString(), turns: 3 }], current: 'a', busy: false, level: 'libre', model: '', effort: '', claude: true, pending: [{ id: 'p1', tool: 'Bash', title: 'Bash', detail: 'git push origin main' }], quota: { part: 0.42, reset: Math.floor(Date.now() / 1000) + 3600, seven: 0.1 } });
    handlers.items({ conv: 'a', items: [{ kind: 'user', text: 'Crée le projet Zeta' }, { kind: 'tool', name: 'Suite · project_folder', target: 'Zeta', ok: true }, { kind: 'ask', title: 'Notes · projects_create', detail: 'name : Zeta', decision: 'auto' }, { kind: 'assistant', text: 'Le projet **Zeta** est créé :\n\n- dossier `C:\\Users\\Valentin\\Dev\\Zeta` avec git\n- fiche dans Notes\n\nTu veux des tâches ?' }] });
  } else post({ cmd: 'pl.ready' });
</script>
