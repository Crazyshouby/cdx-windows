<!doctype html>
<html lang="fr" data-theme="rouge">
<head>
<meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; img-src 'self' data: blob:; media-src 'self' blob:; frame-src 'none'">
<title>CDX — centre rapide</title>
<link rel="stylesheet" href="/cdx/fonts.css">
<link rel="stylesheet" href="/cdx/cdx-ui.css">
<link rel="stylesheet" href="/cdx/themes.css">
<link rel="stylesheet" href="/host/page.css">
<style>
  /* Le centre rapide de windows-ui.html (écran 6) : le son, le réseau, le calendrier. */
  .blk { display: block !important; }
  .row2 { display: flex; align-items: center; gap: 10px; }
  .row2 .btn { flex: none; display: flex; align-items: center; gap: 8px; }
  .btn.on { background: #2a2a2a; box-shadow: var(--bevel-down); }
  .val { width: 44px; flex: none; text-align: right; color: var(--field-ink); }
  .sub { color: var(--faint); margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .caltop { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .caltop b { flex: 1; text-align: center; font-weight: 400; }
  .calg { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 8px; background: var(--ink); border: 1px solid; border-color: var(--sunken-border); box-shadow: var(--sunken-shadow); }
  .calg .h { text-align: center; color: var(--faint); }
  .cd { height: 26px; display: grid; place-items: center; color: var(--field-ink); }
  .cd.f { color: var(--faint); }
  .cd.today { color: #fff; background: var(--btn); box-shadow: var(--bevel), 0 0 0 1px #000, 0 0 0 2px var(--a-mid), 0 0 0 3px var(--a-edge), 0 0 0 4px #000; margin: 0 4px; }
  .status { margin-top: 0; }
  .push { margin-right: auto; }
  .notifs { max-height: 132px; overflow-y: auto; }
  .nt { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-bottom: 1px solid var(--line); min-width: 0; }
  .nt .orb { flex: none; }
  .nt .body { flex: 1; min-width: 0; }
  .nt .ti { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nt .tx { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--faint); }
  .nt .meta { flex: none; color: var(--faint); }
  .nt.warn .ti { color: var(--warn); } .nt.error .ti { color: var(--red); }
  .nt.err .orb, .nt.error .orb { }
  .lgd { display: flex; align-items: center; justify-content: space-between; }
</style>
<script src="/cdx/icons.js"></script>
<script src="/cdx/cdx-bridge.js"></script>
<script src="/host/host.js"></script>
<script src="/shell/shell.js"></script>
</head>
<body>
<div class="win active">
  <div class="tb"><span class="tb-title">Centre rapide</span></div>
  <div class="cb">
    <fieldset class="grp blk"><legend>Son</legend>
      <div class="row2"><button class="btn" id="mute"><span class="pix" data-ic="volume"></span><span id="muteLbl">Son</span></button><input id="vol" type="range" min="0" max="100" value="0"><span class="val" id="volv">–</span></div>
      <div class="sub" id="dev"></div>
    </fieldset>
    <fieldset class="grp blk"><legend>Réseau</legend>
      <div class="status"><span class="orb" id="orb"></span><span id="net">…</span></div>
    </fieldset>
    <fieldset class="grp blk"><legend>Notifications</legend>
      <div class="list dark notifs" id="notifs"></div>
      <div class="btns" style="margin-top:6px"><button class="btn" id="nclear">Effacer</button></div>
    </fieldset>
    <fieldset class="grp blk" style="flex:1"><legend>Calendrier</legend>
      <div class="caltop"><button class="btn" id="prev">←</button><b id="month"></b><button class="btn" id="next">→</button></div>
      <div class="calg" id="cal"></div>
    </fieldset>
    <div class="btns"><button class="btn row2 push" id="quit" title="Quitter le shell CDX et rendre la barre de Windows"><span class="pix" data-ic="quitter"></span>Quitter CDX</button></div>
  </div>
</div>
<script src="/shell/center.js"></script>
</body>
</html>
