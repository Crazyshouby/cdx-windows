<!doctype html>
<html lang="fr" data-theme="rouge">
<head>
<meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; img-src 'self' data: blob:; media-src 'self' blob:; frame-src 'none'">
<title>CDX — Audio Linker</title>
<link rel="stylesheet" href="/cdx/fonts.css">
<link rel="stylesheet" href="/cdx/cdx-ui.css">
<link rel="stylesheet" href="/cdx/themes.css">
<link rel="stylesheet" href="/host/page.css">
<style>
  /* Le déroulant d'Audio Linker, ouvert au-dessus du bouton de la barre (un menu natif sortirait de l'écran vers le bas) : l'état du groupe et son
     bouton, la coupure et le volume, puis la liste des setups. Décision de Valentin du 02/11/2026 (maquette barre-audiolinker.html). */
  .cb { gap: 8px; padding: 8px; }
  .etat { display: flex; align-items: center; gap: 8px; height: 24px; flex: none; }
  .etat .orb { width: 11px; height: 11px; }
  .etat .grow { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .etat .btn { width: auto; padding: 0 10px; height: 22px; }
  .vol { display: flex; align-items: center; gap: 8px; height: 24px; flex: none; }
  .vol input[type="range"] { flex: 1; width: auto; min-width: 0; }
  .vol .alval { flex: none; width: 26px; text-align: right; color: var(--field-ink); font-variant-numeric: tabular-nums; }
  .vol .btn { position: relative; flex: none; width: 26px; height: 22px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
  .vol .btn.muted .pix { opacity: 0.4; }
  .vol .btn.muted::after { content: ""; position: absolute; left: 5px; right: 5px; top: 50%; height: 2px; background: var(--red); transform: rotate(-45deg); }
  .sep { flex: none; height: 0; border-top: 1px solid #111; border-bottom: 1px solid #555; margin: 0 -8px; }
  .etq { flex: none; color: var(--faint); }
  .row-item { cursor: default; }
  .row-item .mark { flex: none; width: 14px; color: var(--green); }
  .row-item .grow { flex: 1; min-width: 0; }
  .row-item .sub { flex: none; color: var(--faint); }
</style>
<script src="/cdx/icons.js"></script>
<script src="/cdx/cdx-bridge.js"></script>
<script src="/host/host.js"></script>
<script src="/shell/shell.js"></script>
</head>
<body>
<div class="win active">
  <div class="tb"><span class="tb-title"><span class="pix" data-ic="volume" data-size="14" style="vertical-align:-2px;margin-right:6px"></span>Audio Linker</span></div>
  <div class="cb">
    <div class="etat"><span class="orb" id="orb"></span><span class="grow" id="etat">—</span><button class="btn" id="run">Démarrer</button></div>
    <div class="vol"><button class="btn" id="mute" title="Couper le groupe"><span class="pix" data-ic="volume"></span></button><input type="range" id="vol" min="0" max="100" value="100" title="Volume du groupe (molette)"><span class="alval" id="val">100</span></div>
    <div class="sep"></div>
    <div class="etq">Setup à jouer</div>
    <div class="list" id="list"></div>
  </div>
</div>
<script src="/shell/audiomenu.js"></script>
</body>
</html>
