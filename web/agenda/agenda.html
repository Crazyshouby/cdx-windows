<!doctype html>
<html lang="fr" data-theme="rouge">
<head>
<meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; img-src 'self' data: blob:; media-src 'self' blob:; frame-src 'none'">
<title>CDX — Agenda</title>
<link rel="stylesheet" href="/cdx/fonts.css">
<link rel="stylesheet" href="/cdx/cdx-ui.css">
<link rel="stylesheet" href="/cdx/themes.css">
<link rel="stylesheet" href="/cdx/cdx-frame.css">
<link rel="stylesheet" href="/host/page.css">
<style>
  /* « Agenda » : le calendrier (mois, semaine, liste) et les tâches du compte Google relié à la suite. Le programme parle à Google ; la page dessine. */
  .top { display: flex; gap: 5px; align-items: center; flex: none; }
  .top .ttl { min-width: 190px; text-align: center; color: var(--text); letter-spacing: 1px; }
  .mbar { display: flex; flex: none; }
  .mb { height: 22px; padding: 2px 12px 0; margin-right: -1px; font: inherit; color: var(--text); cursor: default; background: var(--btn); border: 1px solid #000; box-shadow: var(--bevel); display: flex; align-items: center; }
  .mb:hover { background: #3b3b3b; }
  .mb.on { background: #2a2a2a; box-shadow: var(--bevel-down); color: #fff; }
  .split { flex: 1; min-height: 0; display: flex; gap: 5px; }
  .col { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 5px; }
  .main { flex: 1; }
  .side { flex: none; width: 300px; }
  /* le mois : 7 colonnes, 6 rangées, chaque jour une case creuse */
  .wd { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; flex: none; }
  .wd span { text-align: center; color: var(--faint); padding: 2px 0 0; }
  .cal { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 1fr; gap: 3px; }
  .day { min-height: 0; display: flex; flex-direction: column; gap: 2px; padding: 3px 4px; background: var(--ink); border: 1px solid; border-color: var(--sunken-border); box-shadow: var(--sunken-shadow); overflow: hidden; cursor: default; }
  .day .n { color: var(--faint); flex: none; display: flex; justify-content: space-between; }
  .day.cur .n { color: var(--text); }
  .day.today .n b { color: var(--accent); }
  .day.today { border-color: var(--accent); }
  .day .n b { font-weight: inherit; }
  .ev { flex: none; padding: 1px 4px 0; border-left: 4px solid var(--accent); background: var(--card-2); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: default; }
  .ev:hover { background: var(--row-hover); }
  .ev .t { color: var(--faint); }
  .ev.all { color: #fff; }
  .day .more { color: var(--faint); }
  /* la semaine : 7 colonnes qui listent ; la liste : les jours à venir */
  .week { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .week .day { overflow: auto; }
  .week .ev { white-space: normal; }
  .agenda { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
  .agenda .dh { color: var(--faint); border-bottom: 1px solid var(--line); padding: 4px 2px 2px; }
  .agenda .dh.today { color: var(--accent); }
  .agenda .ev { white-space: normal; padding: 4px 8px 2px; }
  /* les tâches */
  .tl { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 8px; }
  .tl .lh { color: var(--text); letter-spacing: 1px; padding: 2px 2px 0; display: flex; justify-content: space-between; }
  .tl .lh .n { color: var(--faint); }
  .tk { display: flex; align-items: flex-start; gap: 7px; padding: 4px 6px 2px; border-bottom: 1px solid var(--line); cursor: default; }
  .tk:hover { background: var(--row-hover); }
  .tk input { margin: 2px 0 0; flex: none; accent-color: var(--a-edge); }
  .tk .tt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .tk.done .tt { color: var(--faint); text-decoration: line-through; }
  .tk .due { flex: none; color: var(--faint); }
  .tk .due.late { color: var(--red); }
  .tl .text-input { flex: none; }
  .tl .doneh { color: var(--faint); padding: 2px 6px; cursor: default; }
  /* non relié */
  .hello { flex: 1; display: grid; place-items: center; text-align: center; color: var(--text); }
  .hello .box { display: flex; flex-direction: column; gap: 12px; align-items: center; max-width: 520px; }
  .hello .faint { line-height: 1.5; }
  .hello code { font-family: var(--font-log); color: var(--field-ink); user-select: text; }
  .err { color: var(--warn); }
  /* la fiche d'un événement */
  .veil { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; background: rgba(0, 0, 0, .5); }
  .veil .win { position: relative; inset: auto; width: 520px; }
  .veil .cb { gap: 8px; }
  .f { display: grid; grid-template-columns: 110px 1fr; gap: 6px 10px; align-items: center; }
  .f label { color: var(--faint); }
  .f .row { display: flex; gap: 6px; align-items: center; }
  .f textarea { height: 70px; resize: none; }
  .f input[type=date], .f input[type=time] { color-scheme: dark; }
  .detail { display: flex; flex-direction: column; gap: 6px; color: var(--text); user-select: text; }
  .detail .faint { white-space: pre-wrap; }
</style>
<script src="/cdx/icons.js"></script>
<script src="/cdx/cdx-bridge.js"></script>
<script src="/cdx/cdx-frame.js"></script>
<script src="/cdx/cdx-split.js"></script>
<script src="/cdx/cdx-spell.js"></script>
<script src="/host/host.js"></script>
</head>
<body>
<div class="win active" id="win">
  <div class="tb" id="tb" data-dblclick="max"><button class="tb-btn tb-l" id="bx" data-act="close"><svg viewBox="0 0 9 9"><path d="M1 1L8 8M8 1L1 8" stroke="#fff" stroke-width="2" fill="none"/></svg></button><button class="tb-btn tb-m" data-act="menu" title="Réglages"></button><span class="tb-title" id="ttl">Agenda</span><button class="tb-btn tb-r2" id="bmax" data-act="max"><svg viewBox="0 0 9 9"><path d="M1 4.5H8M4.5 1V8" stroke="#fff" stroke-width="2" fill="none"/></svg></button><button class="tb-btn tb-r" id="bmin" data-act="min"><svg viewBox="0 0 9 9"><path d="M1 4.5H8" stroke="#fff" stroke-width="2" fill="none"/></svg></button></div>
  <div class="cb">
    <div class="top">
      <button class="btn" id="prev" title="Précédent">←</button><button class="btn" id="today">Aujourd’hui</button><button class="btn" id="next" title="Suivant">→</button>
      <span class="ttl" id="title"></span>
      <div class="mbar" id="views"><button class="mb" data-v="month">Mois</button><button class="mb" data-v="week">Semaine</button><button class="mb" data-v="list">Liste</button></div>
      <span class="grow"></span>
      <button class="btn" id="new" title="Nouvel événement (Ctrl+N)"><span class="pix" data-ic="editer"></span> Nouvel événement</button>
      <button class="btn" id="refresh" title="Relire (F5)"><span class="pix" data-ic="maj"></span></button>
    </div>
    <div class="split" id="split">
      <div class="col main" id="main"></div>
      <div class="col side" id="side"><div class="tl" id="tasks"></div></div>
    </div>
    <div class="status"><span class="orb" id="orb"></span><span id="st1"></span><span class="faint" id="st2"></span><span style="margin-left:auto" class="faint" id="st3"></span></div>
  </div>
</div>
<i class="rz l" data-e="10"></i><i class="rz r" data-e="11"></i><i class="rz t" data-e="12"></i><i class="rz tl" data-e="13"></i><i class="rz tr" data-e="14"></i><i class="rz b" data-e="15"></i><i class="rz bl" data-e="16"></i><i class="rz br" data-e="17"></i>
<script src="/agenda/agenda.js"></script>
</body>
</html>
