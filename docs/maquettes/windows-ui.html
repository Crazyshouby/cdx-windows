<!doctype html>
<html lang="fr" data-theme="rouge">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CDX-UI pour Windows — maquettes</title>
<link rel="stylesheet" href="../../web/cdx/fonts.css">
<link rel="stylesheet" href="../../web/cdx/cdx-ui.css">
<link rel="stylesheet" href="../../web/cdx/themes.css">
<style>
  /* Maquette de « CDX-UI pour Windows » : douze écrans de 1600 x 900. Seule la mise en page des écrans est ici ;
     les composants viennent de cdx-ui.css. Les quelques composants propres à un système (barre des tâches, jauge,
     bouton radio, infobulle) sont regroupés sous « Extensions Windows » et décrits dans CHARTE-WINDOWS.md. */

  /* ---------- visionneuse ---------- */
  html, body { background: #0b0b0b; }
  #nav { position: fixed; left: 0; right: 0; top: 0; height: 34px; z-index: 100; display: flex; align-items: center; gap: 14px; padding: 0 10px;
         background: var(--panel); border-bottom: 1px solid #000; box-shadow: inset 0 1px 0 #666, inset 0 2px 0 #444; }
  #nav .tabs { padding: 0; background: transparent; }
  #nav .tab { flex: none; }
  #nav .grow { flex: 1; }
  #nav select { width: 150px; flex: none; height: 22px; }
  #nav .btn { height: 22px; }
  #wrap { position: absolute; left: 0; right: 0; top: 34px; bottom: 0; overflow: auto; }
  #stage { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; overflow: hidden; transform-origin: 0 0; }

  /* ---------- le décor ---------- */
  .abs { position: absolute; }
  .wall { position: absolute; inset: 0; background:
      repeating-linear-gradient(0deg, rgba(0, 0, 0, .2) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(135deg, rgba(255, 255, 255, .035) 0 1px, transparent 1px 5px),
      radial-gradient(ellipse 90% 75% at 50% 118%, color-mix(in srgb, var(--a-mid) 85%, #000) 0, transparent 72%),
      linear-gradient(color-mix(in srgb, var(--a-dark) 45%, #000), color-mix(in srgb, var(--a-dark) 80%, #000)); }
  .dim { position: absolute; inset: 0; background: rgba(0, 0, 0, .6); }
  .w { position: absolute; }
  .w.rel { position: relative; flex: none; }
  .w > .win { height: 100%; }
  /* une fenêtre inactive posée dans une fenêtre active reprend ses gris (les jetons de titre sont hérités) */
  .win:not(.active) { --tb-edge: #555555; --tb-low: #222222; --tb-grad: linear-gradient(#0c0c0c, #222222 47%, #8f8f8f); --tbb-fill: #444444; --tbb-hi: #8a8a8a; --tbb-lo: #222222; }
  .w .cb { overflow: hidden; }

  /* icônes du bureau : 32 px (deux fois 16), jamais lissées */
  .icons { position: absolute; left: 14px; top: 14px; display: flex; flex-direction: column; gap: 6px; }
  .di { width: 92px; padding: 8px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; text-shadow: 0 1px 0 #000, 1px 0 0 #000, -1px 0 0 #000, 0 -1px 0 #000; }
  .di.sel { background: var(--row-sel); box-shadow: inset 0 0 0 1px var(--row-sel-ring); }

  /* ================= Extensions Windows ================= */
  /* La barre des tâches : un panneau en relief au bas de l'écran. Bouton enfoncé + barre d'accent = fenêtre active. */
  .taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 36px; z-index: 40; display: flex; align-items: center; gap: 6px; padding: 0 6px;
             background: var(--panel); border-top: 1px solid #000; box-shadow: inset 0 1px 0 #666, inset 0 2px 0 #444; }
  .tk { position: relative; flex: none; display: flex; align-items: center; gap: 8px; height: 26px; min-width: 150px; max-width: 240px; padding: 0 10px 0 8px;
        font: inherit; color: var(--text); white-space: nowrap; overflow: hidden; cursor: pointer; background: var(--btn); border: 1px solid #000; box-shadow: var(--bevel); }
  .tk:hover { background: #3b3b3b; }
  .tk > span:last-child { overflow: hidden; text-overflow: ellipsis; }
  .tk.on { background: #2a2a2a; box-shadow: var(--bevel-down); }
  .tk.on::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--bar); border-right: 1px solid #000; }
  .tk.on { padding-left: 14px; }
  .tk.attn { color: var(--warn); }
  .tk.start { min-width: 0; padding: 0 14px 0 8px; }
  .tk.pin { min-width: 0; width: 30px; padding: 0; justify-content: center; }
  .tsep { flex: none; width: 2px; height: 22px; border-left: 1px solid #111; border-right: 1px solid #555; }
  .tsearch { flex: none; width: 210px; height: 26px; display: flex; align-items: center; gap: 8px; padding: 0 8px; }
  .ph { color: var(--faint) !important; }
  .tray { flex: none; display: flex; align-items: center; gap: 12px; height: 26px; padding: 0 10px; background: var(--ink); color: var(--field-ink); border: 1px solid; border-color: var(--sunken-border); box-shadow: var(--sunken-shadow); }
  .tray .n { display: flex; align-items: center; gap: 4px; color: var(--warn); }
  .showdesk { flex: none; width: 10px; height: 26px; padding: 0; background: var(--btn); border: 1px solid #000; box-shadow: var(--bevel); }

  /* Jauge : une rigole noire creusée et la barre d'accent. Ambre = attention, rouge = problème. */
  .gauge { height: 14px; background: var(--ink); border: 1px solid; border-color: var(--sunken-border); box-shadow: var(--sunken-shadow); }
  .gauge > i { display: block; height: 100%; background: var(--bar); }
  .gauge.warn > i { background: linear-gradient(#ffc860, var(--warn) 45%, #b05a00); }
  .gauge.big { height: 22px; }
  .gr { display: grid; grid-template-columns: 52px 1fr 60px; gap: 8px; align-items: center; }
  .gr .v { text-align: right; color: var(--field-ink); }

  /* Bouton radio : même plot que la case, mais octogonal, avec un carré d'accent au centre. */
  .radio { position: relative; width: 14px; height: 14px; flex: none; background: var(--btn); border: 1px solid #000; box-shadow: var(--bevel); clip-path: var(--chamfer2); }
  .radio.on::after { content: ""; position: absolute; left: 3px; top: 3px; width: 6px; height: 6px; background: var(--bar); box-shadow: 0 0 0 1px #000; }

  /* Infobulle : boîte noire, filet gris, ombre dure. */
  .tip { position: absolute; padding: 3px 8px; background: var(--ink); color: var(--text); border: 1px solid #888; box-shadow: 2px 3px 0 rgba(0, 0, 0, .5); white-space: nowrap; z-index: 60; }
  .menu { position: absolute; }
  .menu-item .k { margin-left: auto; padding-left: 28px; color: var(--faint); }
  .menu-item.off { color: var(--faint); }
  .menu-item.off:hover { background: none; box-shadow: none; }

  /* barre de menus d'une application : boutons carrés, filet noir partagé */
  .mbar { display: flex; flex: none; }
  .mb { height: 22px; padding: 0 12px; margin-right: -1px; font: inherit; color: var(--text); cursor: pointer; background: var(--btn); border: 1px solid #000; box-shadow: var(--bevel); }
  .mb:hover { background: #3b3b3b; }
  .mb.sq { padding: 0; width: 24px; }
  .tool { display: flex; align-items: center; gap: 6px; padding: 0 10px 0 6px; }

  /* ---------- mises en page propres aux écrans ---------- */
  .pad { flex: 1; white-space: pre-wrap; font: 14px/13px var(--font-log); padding: 6px 8px; }
  .toastbox { position: absolute; left: 50%; bottom: 56px; transform: translateX(-50%); z-index: 50; }
  .toast.show { opacity: 1; transform: none; }
  .toast .t2 { color: var(--faint); }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .tile { display: flex !important; flex-direction: column; align-items: center; justify-content: center; gap: 10px; height: 84px; }
  .blk { display: block !important; }
  .fr { display: grid; grid-template-columns: 1fr 170px 170px 90px; gap: 0; align-items: center; height: 26px; border-left: 6px solid transparent; border-bottom: 1px solid var(--line); }
  .fr > * { padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fr:hover { background: var(--row-hover); }
  .fr.sel { background: var(--row-sel); box-shadow: inset 0 0 0 1px var(--row-sel-ring); }
  .fr .nm { display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; }
  .fr .r { text-align: right; }
  .lhead.o6 { padding-left: 6px; }
  .fr .f { color: var(--faint); }
  .split { flex: 1; min-height: 0; display: flex; gap: 5px; }
  .col { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 3px; }
  .sw7 { display: flex; gap: 8px; grid-column: 1 / -1; }
  .sw7 .btn { width: 56px; height: 34px; padding: 0; display: grid; place-items: center; }
  .sw7 .btn i { display: block; width: 28px; height: 14px; background: var(--c); border: 1px solid #000; box-shadow: inset 1px 1px 0 rgba(255, 255, 255, .35); }
  .sw7 .btn.on { box-shadow: var(--bevel-down); }
  .sw7 .btn.on i { outline: 2px solid #fff; outline-offset: 2px; }
  .scope { background: var(--ink); border: 1px solid; border-color: var(--sunken-border); box-shadow: var(--sunken-shadow); color: var(--field-ink); }
  .scope svg { display: block; width: 100%; height: 66px; }
  .qt { display: flex !important; flex-direction: column; align-items: center; justify-content: center; gap: 8px; height: 70px; position: relative; }
  .qt.on { background: #2a2a2a; box-shadow: var(--bevel-down); }
  .qt.on::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--bar); }
  .caltop { display: flex; align-items: center; gap: 8px; }
  .caltop b { flex: 1; text-align: center; font-weight: 400; }
  .calg { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 8px; background: var(--ink); border: 1px solid; border-color: var(--sunken-border); box-shadow: var(--sunken-shadow); }
  .calg .h { text-align: center; color: var(--faint); }
  .cd { height: 28px; display: grid; place-items: center; color: var(--field-ink); }
  .cd.f { color: var(--faint); }
  .cd.today { color: #fff; background: var(--btn); box-shadow: var(--bevel), 0 0 0 1px #000, 0 0 0 2px var(--a-mid), 0 0 0 3px var(--a-edge), 0 0 0 4px #000; margin: 0 4px; }
  .strip { position: absolute; left: 50%; top: 320px; transform: translateX(-50%); display: flex; gap: 26px; }
  .cardbody { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: var(--ink); border: 1px solid; border-color: var(--sunken-border); box-shadow: var(--sunken-shadow); }
  .big { font-size: 112px; line-height: 112px; }
  .mid { font-size: 28px; line-height: 32px; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; flex: 1; }
  .keys .btn, .keys .primary { height: auto; margin: 0; }
  .bsod { position: absolute; inset: 0; background: var(--a-mid); color: #fff; }
  .bsod .gauge { background: var(--a-dark); border-color: #000; }
  .cap { color: var(--faint); margin-top: 6px; }
  .cell { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .lab { position: absolute; z-index: 70; color: #fff; text-shadow: 0 1px 0 #000; }
</style>
</head>
<body>
<script src="../../web/cdx/icons.js"></script>

<div id="nav">
  <div class="tabs" id="tabs"></div>
  <span class="grow"></span>
  <label for="theme" class="faint">Accent :</label>
  <select id="theme" class="btn">
    <option value="rouge">Rouge CDX</option><option value="bleu">Bleu électrique</option><option value="vert">Vert électrique</option>
    <option value="violet">Violet électrique</option><option value="ambre">Ambre CRT</option><option value="sarcelle">Sarcelle</option><option value="charbon">Charbon</option>
  </select>
  <button class="btn" id="zoom">Taille réelle</button>
</div>
<div id="wrap"><div id="stage"></div></div>

<script>
/* ======================================================================== outils */
const I = (n, s = 16) => `<span class="pix">${pix(n, s)}</span>`;
const GL = {
  x: '<svg viewBox="0 0 9 9"><path d="M1 1L8 8M8 1L1 8" stroke="#fff" stroke-width="2" fill="none"/></svg>',
  minus: '<svg viewBox="0 0 9 9"><path d="M1 4.5H8" stroke="#fff" stroke-width="2" fill="none"/></svg>',
  plus: '<svg viewBox="0 0 9 9"><path d="M1 4.5H8M4.5 1V8" stroke="#fff" stroke-width="2" fill="none"/></svg>'
};
// Une fenêtre : cadre CDX, barre de titre à quatre boutons (fermer, menu, agrandir, réduire), onglets facultatifs.
const W = ({ x = 0, y = 0, w = 300, h = 200, t = '', on = false, body = '', cls = '', tabs = '', z = '', rel = false, noctl = false, shaded = false }) => {
  const pos = rel ? `width:${w}px;height:${h}px;` : `left:${x}px;top:${y}px;width:${w}px;height:${h}px;`;
  const ctl = noctl ? ['', ''] : [`<button class="tb-btn tb-l">${GL.x}</button><button class="tb-btn tb-m"></button>`, `<button class="tb-btn tb-r2">${GL.plus}</button><button class="tb-btn tb-r">${GL.minus}</button>`];
  return `<div class="w ${rel ? 'rel' : ''}" style="${pos}${z ? `z-index:${z};` : ''}"><div class="win ${on ? 'active' : ''} ${shaded ? 'shaded' : ''}"><div class="tb">${ctl[0]}<span class="tb-title">${t}</span>${ctl[1]}</div>${tabs}<div class="cb ${cls}">${body}</div><i class="grip-rz"></i></div></div>`;
};
const tabs = (names, on = 0) => `<div class="tabs">${names.map((n, i) => `<button class="tab ${i === on ? 'on' : ''}">${n}</button>`).join('')}</div>`;
const mbar = names => `<div class="mbar">${names.map(n => `<button class="mb">${n}</button>`).join('')}</div>`;
const orb = c => `<span class="orb ${c}"></span>`;
const wall = '<div class="wall"></div>';
const desk = sel => `<div class="icons">${[['pc', 'Ce PC'], ['dossier', 'Documents'], ['serveur', 'Réseau'], ['supprimer', 'Corbeille'], ['kirc', 'KIRC'], ['console', 'Terminal']]
  .map(([i, n]) => `<div class="di ${n === sel ? 'sel' : ''}">${I(i, 32)}<span>${n}</span></div>`).join('')}</div>`;

// La barre des tâches. start : menu Démarrer ouvert ; tasks : [{i, t, s}] avec s = on (active) | attn (réclame l'attention).
const taskbar = ({ start = false, tasks = [] } = {}) => `<div class="taskbar">
  <button class="tk start ${start ? 'on' : ''}" data-go="demarrer">${I('demarrer')}<span>Démarrer</span></button>
  <div class="text-input ph tsearch">${I('recherche')}<span>Rechercher…</span></div>
  <i class="tsep"></i>
  ${['dossier', 'serveur', 'message', 'reglages'].map(p => `<button class="tk pin">${I(p)}</button>`).join('')}
  <i class="tsep"></i>
  ${tasks.map(k => `<button class="tk ${k.s || ''}">${I(k.i)}<span>${k.t}</span></button>`).join('')}
  <span style="flex:1"></span>
  <div class="tray">${I('wifi')}${I('volume')}<span class="n">${I('cloche')}3</span><span>21:34</span><span>ven. 30 oct.</span></div>
  <button class="showdesk"></button>
</div>`;

const toast = (ok, i, a, b) => `<div class="toast show ${ok ? 'ok' : ''}">${I(i, 16)}<div><div>${a}</div><div class="t2">${b}</div></div></div>`;

// Série pseudo-aléatoire reproductible, pour les oscilloscopes
const series = (n, seed, base, amp) => { let s = seed, v = base; return Array.from({ length: n }, () => { s = (s * 16807) % 2147483647; v += ((s / 2147483647) - .5) * amp; v = Math.max(4, Math.min(60, v)); return v; }); };
const scope = (seed, base, amp) => {
  const d = series(68, seed, base, amp);
  let path = `M0 ${d[0].toFixed(0)}`; d.forEach((v, i) => { if (i) path += `H${i * 5}V${v.toFixed(0)}`; });
  return `<div class="scope"><svg viewBox="0 0 340 66" preserveAspectRatio="none" shape-rendering="crispEdges"><path d="M0 16.5H340M0 33.5H340M0 50.5H340" stroke="currentColor" opacity=".22" fill="none"/><path d="${path}" stroke="currentColor" stroke-width="1" fill="none"/></svg></div>`;
};
const qr = () => { let s = 7, out = '', n = 21;
  const fin = (x, y) => (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
  const finder = (x, y) => { const lx = x < 8 ? x : x - (n - 8), ly = y < 8 ? y : y - (n - 8); if (lx === 7 || ly === 7) return false; const d = Math.max(Math.abs(lx - 3), Math.abs(ly - 3)); return d !== 2; };
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) { s = (s * 16807) % 2147483647; const on = fin(x, y) ? finder(x, y) : s % 2 === 0; if (on) out += `M${x} ${y}h1v1h-1z`; }
  return `<svg width="${n * 5}" height="${n * 5}" viewBox="-1 -1 ${n + 2} ${n + 2}" shape-rendering="crispEdges" style="background:#fff;padding:0"><path d="${out}" fill="#000"/></svg>`; };

/* ======================================================================== les écrans */
const SCENES = {};
const ORDER = [['bureau', 'Bureau'], ['demarrer', 'Démarrer'], ['explorateur', 'Explorateur'], ['parametres', 'Paramètres'], ['taches', 'Tâches'], ['centre', 'Centre rapide'],
               ['alttab', 'Alt+Tab'], ['dialogues', 'Dialogues'], ['verrou', 'Verrouillage'], ['apps', 'Applications'], ['arret', 'Arrêt'], ['elements', 'Éléments']];

/* ---------- 1. Bureau ---------- */
SCENES.bureau = () => `${wall}${desk('Documents')}
${W({ x: 1262, y: 24, w: 314, h: 168, t: 'Système', body: `
  <div class="gr"><span>CPU</span><div class="gauge"><i style="width:12%"></i></div><span class="v">12 %</span></div>
  <div class="gr"><span>RAM</span><div class="gauge"><i style="width:16%"></i></div><span class="v">5,1 Go</span></div>
  <div class="gr"><span>GPU</span><div class="gauge"><i style="width:3%"></i></div><span class="v">3 %</span></div>
  <div class="gr"><span>C:</span><div class="gauge warn"><i style="width:87%"></i></div><span class="v">87 %</span></div>
  <div class="status">${orb('green')}<span>Ryzen 7 3700X — 52 °C</span></div>` })}
${W({ x: 420, y: 150, w: 660, h: 390, t: 'notes-cdx.txt — Bloc-notes', on: true, body: `${mbar(['Fichier', 'Édition', 'Format', 'Affichage'])}
  <div class="text-input pad">Charte CDX pour Windows

- des fenêtres sans bordure système
- un relief éclairé en haut à gauche
- une seule couleur d'accent

à faire : essayer le thème bleu_</div>
  <div class="status"><span>Ln 7, Col 29</span><span class="faint">UTF-8</span></div>` })}
<div class="toastbox">${toast(true, 'disque', 'Sauvegarde terminée', '2,3 Go copiés vers E:\\Sauvegardes')}</div>
${taskbar({ tasks: [{ i: 'journal', t: 'notes-cdx.txt', s: 'on' }, { i: 'console', t: 'Terminal' }] })}`;

/* ---------- 2. Démarrer ---------- */
SCENES.demarrer = () => `${wall}${desk()}
${W({ x: 6, y: 372, w: 600, h: 486, t: 'Démarrer', on: true, body: `
  <div class="text-input ph" style="flex:none;display:flex;align-items:center;gap:8px;height:28px">${I('recherche')}Tapez pour chercher une application ou un fichier…</div>
  <fieldset class="grp blk"><legend>Épinglées</legend><div class="tiles">
    ${[['dossier', 'Explorateur'], ['reglages', 'Paramètres'], ['console', 'Terminal'], ['serveur', 'Navigateur'], ['message', 'Courrier'], ['carnet', 'Contacts'], ['musique', 'Musique'], ['image', 'Images']]
      .map(([i, n]) => `<button class="btn tile">${I(i, 32)}<span>${n}</span></button>`).join('')}</div></fieldset>
  <fieldset class="grp blk"><legend>Récents</legend>
    ${[['liste', 'Charte graphique', 'il y a 2 h'], ['image', 'capture-cdx.png', 'hier'], ['journal', 'notes-cdx.txt', 'hier']]
      .map(([i, n, d]) => `<div class="row-item">${I(i)}<span class="grow">${n}</span><span class="faint">${d}</span></div>`).join('')}</fieldset>
  <div class="btns"><div class="row push">${I('utilisateur', 32)}<span>Valentin</span></div>
    <button class="btn row">${I('cadenas')}Verrouiller</button><button class="btn row">${I('absent')}Veille</button><button class="btn row">${I('quitter')}Éteindre</button></div>` })}
${taskbar({ start: true })}`;

/* ---------- 3. Explorateur ---------- */
SCENES.explorateur = () => {
  const files = [['dossier', 'Charte graphique', '29/10/2026 18:30', 'Dossier de fichiers', ''], ['dossier', 'Factures 2026', '02/10/2026 09:12', 'Dossier de fichiers', ''],
    ['dossier', 'KIRC', '29/10/2026 20:41', 'Dossier de fichiers', ''], ['dossier', 'Projets Godot', '14/09/2026 22:03', 'Dossier de fichiers', ''],
    ['image', 'capture-cdx.png', '28/10/2026 08:20', 'Image PNG', '2,3 Mo'], ['fichier', 'CV-2026.pdf', '12/10/2026 16:44', 'Document PDF', '214 Ko'],
    ['journal', 'notes-cdx.txt', '27/10/2026 14:55', 'Document texte', '4 Ko'], ['fichier', 'budget.xlsx', '03/10/2026 10:01', 'Feuille de calcul', '38 Ko'],
    ['image', 'logo-kirc.svg', '21/10/2026 19:12', 'Image SVG', '12 Ko'], ['fichier', 'themes.css', '29/10/2026 18:46', 'Feuille de style', '3 Ko'],
    ['musique', 'ambiance.mp3', '18/09/2026 21:30', 'Fichier MP3', '6,1 Mo'], ['video', 'demo-kirc.mp4', '25/10/2026 23:08', 'Vidéo MP4', '48 Mo'],
    ['fichier', 'notes-reunion.docx', '09/10/2026 11:20', 'Document Word', '27 Ko'], ['image', 'fond-ecran.png', '30/10/2026 09:03', 'Image PNG', '1,1 Mo'],
    ['fichier', 'contrat.pdf', '30/09/2026 15:12', 'Document PDF', '402 Ko'], ['journal', 'todo.txt', '28/10/2026 07:40', 'Document texte', '1 Ko'],

/* ======================================================================== visionneuse */
const stage = document.getElementById('stage'), wrap = document.getElementById('wrap'), tabsEl = document.getElementById('tabs');
let current = 'bureau', real = false;
tabsEl.innerHTML = ORDER.map(([k, n]) => `<button class="tab" data-go="${k}">${n}</button>`).join('');
function fit() {
  const s = real ? 1 : Math.min(wrap.clientWidth / 1600, wrap.clientHeight / 900);
  stage.style.transform = `scale(${s})`;
  stage.style.left = real ? '0px' : `${(wrap.clientWidth - 1600 * s) / 2}px`;
  stage.style.top = real ? '0px' : `${(wrap.clientHeight - 900 * s) / 2}px`;
  wrap.style.overflow = real ? 'auto' : 'hidden';
}
function show(id) {
  if (!SCENES[id]) id = 'bureau';
  current = id; stage.innerHTML = SCENES[id]();
  tabsEl.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.go === id));
  try { history.replaceState(null, '', '#' + id); } catch (e) { /* page ouverte hors serveur : sans importance */ }
}
function setTheme(k) { document.documentElement.dataset.theme = k; document.getElementById('theme').value = k; show(current); }
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) show(g.dataset.go);
  const t = e.target.closest('[data-theme-set]'); if (t) setTheme(t.dataset.themeSet);
});
document.getElementById('theme').addEventListener('change', e => setTheme(e.target.value));
document.getElementById('zoom').addEventListener('click', e => { real = !real; e.target.textContent = real ? 'Ajuster' : 'Taille réelle'; fit(); });
document.addEventListener('keydown', e => {
  const i = ORDER.findIndex(o => o[0] === current);
  if (e.key === 'ArrowRight') show(ORDER[(i + 1) % ORDER.length][0]);
  if (e.key === 'ArrowLeft') show(ORDER[(i + ORDER.length - 1) % ORDER.length][0]);
});
addEventListener('resize', fit);
const q = new URLSearchParams(location.search);
if (q.get('theme')) document.documentElement.dataset.theme = q.get('theme'), document.getElementById('theme').value = q.get('theme');
if (q.get('shot')) { document.getElementById('nav').style.display = 'none'; wrap.style.top = '0'; }
fit(); show(q.get('scene') || location.hash.slice(1) || 'bureau'); fit();
</script>
