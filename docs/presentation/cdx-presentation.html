<!doctype html>
<html lang="fr" data-theme="rouge">
<head>
<meta charset="utf-8">
<title>CDX — présentation animée</title>
<!-- Une animation de 14 secondes (1280 x 720) qui présente la suite CDX et ce que Pilote fait avec les outils faits pour lui.
     Pilotée par le temps : sans paramètre, elle joue en boucle ; avec ?t=<millisecondes>, elle rend l'image de cet instant (render.py en fait une vidéo
     avec Chrome headless et ffmpeg). Les éléments viennent de la charte (polices pixel, icônes, jetons) : rien n'est dessiné à la main ici. -->
<link rel="stylesheet" href="../../web/cdx/fonts.css">
<link rel="stylesheet" href="../../web/cdx/cdx-ui.css">
<link rel="stylesheet" href="../../web/cdx/themes.css">
<script src="../../web/cdx/icons.js"></script>
<style>
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #1e1e1e; }
  body { font-family: "KIRC Pixel", sans-serif; color: #fff; position: relative; }
  .stage { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, #3a3a3a 0%, #262626 55%, #161616 100%); }
  .el { position: absolute; opacity: 0; will-change: transform, opacity; }
  svg { image-rendering: pixelated; shape-rendering: crispEdges; display: block; }

  #logo { left: 512px; top: 190px; width: 256px; height: 256px; transform-origin: 50% 50%; }
  #title { left: 0; width: 1280px; top: 460px; text-align: center; font-size: 84px; line-height: 84px; letter-spacing: 6px; }
  #sub { left: 0; width: 1280px; top: 556px; text-align: center; font-size: 28px; line-height: 28px; color: #bbb; }

  #bar { left: 0; right: 0; bottom: 0; height: 64px; background: var(--bar); border-top: 2px solid #000; box-shadow: 0 -4px 0 rgba(0,0,0,.35); opacity: 1; }
  .app { position: absolute; top: 606px; width: 128px; text-align: center; transform-origin: 50% 70%; opacity: 0; }
  .app .ic { display: inline-block; width: 48px; height: 48px; background: #262626; border: 2px solid #000; box-shadow: inset 0 0 0 2px #444; padding: 6px; }
  .app .nm { margin-top: 6px; font-size: 18px; line-height: 18px; color: #fff; text-shadow: 1px 1px 0 #000; }

  #win { left: 300px; top: 110px; width: 680px; height: 430px; background: #333; border: 2px solid #000; box-shadow: 8px 8px 0 rgba(0,0,0,.45), inset 0 0 0 2px #555; }
  #win .tb { height: 28px; line-height: 28px; background: linear-gradient(#e83c3c, #c01010 50%, #8a0202); border-bottom: 2px solid #000; padding: 0 12px; font-size: 20px; display: flex; align-items: center; gap: 10px; }
  #win .tb svg { width: 20px; height: 20px; }
  #win .body { padding: 18px 22px; font-size: 20px; line-height: 26px; }
  .msg { max-width: 560px; padding: 10px 14px; border: 2px solid #000; margin-bottom: 14px; }
  .msg.u { background: #8a0202; color: #fff; margin-left: auto; }
  .msg.a { background: #262626; color: #fff; }
  .tool { display: flex; align-items: center; gap: 12px; height: 36px; font-size: 19px; opacity: 0; }
  .tool svg { width: 24px; height: 24px; }
  .tool .what { color: #ddd; }
  .tool .ok { margin-left: auto; color: #3ccf3c; }
  .cursor { display: inline-block; width: 10px; height: 20px; background: #fff; vertical-align: -3px; }

  #links { left: 0; top: 0; width: 1280px; height: 720px; pointer-events: none; opacity: 1; }
  #links path { fill: none; stroke: #ff8a74; stroke-width: 4; stroke-dasharray: 12 8; }

  #tag { left: 0; width: 1280px; top: 250px; text-align: center; font-size: 56px; line-height: 64px; }
  #tag2 { left: 0; width: 1280px; top: 340px; text-align: center; font-size: 28px; line-height: 32px; color: #ccc; }
  #logo2 { left: 592px; top: 420px; width: 96px; height: 96px; }
</style>
</head>
<body>
<div class="stage">
  <div class="el" id="logo"></div>
  <div class="el" id="title">CDX</div>
  <div class="el" id="sub">Une suite d'applications faites maison</div>

  <div class="el" id="bar"></div>
  <div id="apps"></div>

  <svg class="el" id="links" viewBox="0 0 1280 720"></svg>

  <div class="el" id="win">
    <div class="tb"><span id="wic"></span>Pilote</div>
    <div class="body">
      <div class="msg u" id="ask"><span id="asktext"></span><span class="cursor" id="cur"></span></div>
      <div id="tools"></div>
      <div class="msg a el" id="ans">C'est fait : le dépôt est créé, la fiche écrite, la réunion posée, Marie prévenue.</div>
    </div>
  </div>

  <div class="el" id="tag">Des outils faits pour l'IA.</div>
  <div class="el" id="tag2">Pilote travaille dans vos applications, pas à côté.</div>
  <div class="el" id="logo2"></div>
</div>
<script>
  const DUR = 14000;
  const APPS = [['explorateur', 'Explorateur'], ['navigateur', 'Navigateur'], ['depots', 'Dépôts'], ['transferts', 'Transferts'], ['notes', 'Notes'], ['terminal', 'Terminal'], ['agenda', 'Agenda'], ['courrier', 'Courrier'], ['pilote', 'Pilote']];
  const TOOLS = [['depots', 'Dépôts', 'project_folder · Zeta (dossier + git)'], ['notes', 'Notes', 'projects_create · fiche Projets/Zeta'], ['agenda', 'Agenda', 'événement · réunion jeudi 10:00'], ['courrier', 'Courrier', 'message · Marie prévenue']];
  const ASK = 'Crée le projet Zeta, note la réunion de jeudi et préviens Marie.';
  const $ = id => document.getElementById(id);
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const seg = (t, a, b) => clamp((t - a) / (b - a));                 // 0 → 1 entre a et b (secondes)
  const outBack = x => 1 + 2.4 * Math.pow(x - 1, 3) + 1.4 * Math.pow(x - 1, 2);
  const outCubic = x => 1 - Math.pow(1 - x, 3);
  const inOut = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
  const ACC = { R: '#e02020', r: '#8a0202' };
  const icon = (name, size) => pix(name, size).replace(/var\(--ic-accent,#e02020\)/g, ACC.R).replace(/var\(--ic-accent-dark,#8a0202\)/g, ACC.r);

  // ---- construction ----
  $('logo').innerHTML = icon('cdx', 256); $('logo2').innerHTML = icon('cdx', 96); $('wic').innerHTML = icon('pilote', 20);
  const appsBox = $('apps'), appEls = [];
  APPS.forEach(([k, n], i) => {
    const d = document.createElement('div'); d.className = 'app'; d.style.left = (640 - 128 * 4.5 + i * 128) + 'px';
    d.innerHTML = `<span class="ic">${icon(k, 48)}</span><div class="nm">${n}</div>`; appsBox.appendChild(d); appEls.push(d);
  });
  const toolsBox = $('tools'), toolEls = [];
  TOOLS.forEach(([k, n, what]) => {
    const d = document.createElement('div'); d.className = 'tool';
    d.innerHTML = `${icon(k, 24)}<b>${n}</b><span class="what">${what}</span><span class="ok">ok</span>`; toolsBox.appendChild(d); toolEls.push(d);
  });
  const links = $('links'), linkEls = [];
  TOOLS.forEach(([k]) => { const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); links.appendChild(p); linkEls.push(p); });

  // ---- l'image à l'instant t (secondes) ----
  function render(t) {
    // 1. le logo et le titre (0 → 2,4 s), puis ils se rangent en haut à gauche
    const a1 = outBack(seg(t, 0.1, 0.8)), shrink = inOut(seg(t, 2.2, 2.9));
    const lx = 512 + (24 - 512) * shrink, ly = 190 + (16 - 190) * shrink, ls = 1 + (0.25 - 1) * shrink;
    const logo = $('logo'); logo.style.opacity = t > 0.1 ? 1 : 0; logo.style.transform = `translate(${lx - 512}px, ${ly - 190}px) scale(${a1 * ls})`;
    const title = $('title'); const tt = seg(t, 0.7, 1.3);
    title.style.opacity = tt * (1 - shrink); title.style.transform = `translateY(${(1 - outCubic(tt)) * 30}px)`;
    const sub = $('sub'); const ts = seg(t, 1.3, 1.9); sub.style.opacity = ts * (1 - shrink); sub.style.transform = `translateY(${(1 - outCubic(ts)) * 20}px)`;
    // 2. la barre monte, les neuf applications apparaissent une à une (2,6 → 5,8 s)
    const bb = outCubic(seg(t, 2.6, 3.1)); $('bar').style.transform = `translateY(${(1 - bb) * 70}px)`; $('bar').style.opacity = 1;
    appEls.forEach((d, i) => {
      const s = seg(t, 3.0 + i * 0.28, 3.0 + i * 0.28 + 0.4), bump = TOOLS.findIndex(x => x[0] === APPS[i][0]);
      let sc = outBack(s);
      if (bump >= 0) { const bt = 8.4 + bump * 0.75; const b = seg(t, bt, bt + 0.25), b2 = seg(t, bt + 0.25, bt + 0.6); sc *= 1 + 0.35 * (b - b2); }
      d.style.opacity = s; d.style.transform = `scale(${sc})`;
    });
    // 3. la fenêtre de Pilote, la demande tapée, les outils, la réponse (6 → 12 s)
    const w = outCubic(seg(t, 6.0, 6.6)), wout = seg(t, 12.0, 12.5);
    const win = $('win'); win.style.opacity = w * (1 - wout); win.style.transform = `translateY(${(1 - w) * 40 - wout * 30}px) scale(${1 - 0.05 * wout})`;
    const typed = Math.round(ASK.length * seg(t, 6.7, 8.1)); $('asktext').textContent = ASK.slice(0, typed);
    $('cur').style.opacity = t > 6.6 && t < 8.3 && Math.floor(t * 4) % 2 === 0 ? 1 : 0;
    toolEls.forEach((d, i) => { const s = seg(t, 8.4 + i * 0.75, 8.7 + i * 0.75); d.style.opacity = s; d.style.transform = `translateX(${(1 - outCubic(s)) * -24}px)`; d.querySelector('.ok').style.opacity = seg(t, 8.9 + i * 0.75, 9.1 + i * 0.75); });
    // les liens : de la ligne d'outil vers l'icône de l'application dans la barre
    linkEls.forEach((p, i) => {
      const ai = APPS.findIndex(x => x[0] === TOOLS[i][0]); const x2 = 640 - 128 * 4.5 + ai * 128 + 64, y2 = 606;
      const y1 = 110 + 28 + 18 + 70 + 36 * i + 18, under = x2 > 300 && x2 < 980;
      // sous la fenêtre : une descente droite depuis son bord bas ; sinon, on sort par le bord droit à la hauteur de la ligne d'outil, puis on descend
      const d = under ? `M${x2} ${540} L${x2} ${y2}` : `M${980} ${y1} L${x2} ${y1} L${x2} ${y2}`;
      p.setAttribute('d', d);
      const len = under ? y2 - 540 : Math.abs(x2 - 980) + (y2 - y1);
      const s = seg(t, 8.5 + i * 0.75, 8.95 + i * 0.75);
      p.style.strokeDashoffset = (1 - s) * len; p.style.strokeDasharray = `${len} ${len}`; p.style.opacity = s * (1 - wout);
    });
    const an = outCubic(seg(t, 11.3, 11.7)); const ans = $('ans'); ans.style.opacity = an; ans.style.transform = `translateY(${(1 - an) * 12}px)`;
    // 4. la signature (12,4 → 14 s)
    const g1 = outCubic(seg(t, 12.4, 12.9)), g2 = outCubic(seg(t, 12.8, 13.3)), g3 = outBack(seg(t, 13.0, 13.5));
    $('tag').style.opacity = g1; $('tag').style.transform = `translateY(${(1 - g1) * 20}px)`;
    $('tag2').style.opacity = g2; $('tag2').style.transform = `translateY(${(1 - g2) * 16}px)`;
    $('logo2').style.opacity = seg(t, 13.0, 13.1); $('logo2').style.transform = `scale(${g3})`;
    const dim = seg(t, 12.3, 12.8); appsBox.style.opacity = 1 - 0.6 * dim; $('bar').style.opacity = 1 - 0.6 * dim;
  }

  const q = new URLSearchParams(location.search).get('t');
  if (q !== null) { render((+q) / 1000); document.documentElement.dataset.ready = '1'; }
  else { const t0 = performance.now(); (function loop() { render(((performance.now() - t0) % (DUR + 800)) / 1000); requestAnimationFrame(loop); })(); }
</script>
</body>
</html>
